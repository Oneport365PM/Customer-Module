<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OnePort365 Backoffice · Customers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Open+Sans:wght@400;500;700&display=swap" />
  <style>
    /*
      OnePort 365 — design tokens.
      Copied from Backoffice2.0/design/tokens.css (source of truth: DESIGN_SYSTEM.md).
      Do not hand-roll new colors/fonts elsewhere.
    */
    :root {
      /* ---- Brand colour ---- */
      --op-dark-green: #023819;
      --op-light-green: #D1DBBD;
      --op-accent-lime: #BFFB4F;
      --op-accent-lime-hover: #a9e83a;
      --op-gold: #FFCC1A;
      --op-white: #FFFFFF;
      --op-cream: #FDFBF1;
      --op-silver-light: #808080;
      --op-silver-dark: #383838;
      --op-error: #FF1A1A;
      --op-success: #1F8A5B;

      /* ---- Semantic chip pairs (bg / text) ---- */
      --op-chip-neutral-bg: #EDEFE8;
      --op-chip-neutral-text: #4a5a3f;
      --op-chip-success-bg: #E1F1E8;
      --op-chip-success-text: #0f7a45;
      --op-chip-warning-bg: #FFF3CC;
      --op-chip-warning-text: #8a6a00;
      --op-chip-error-bg: #FDE0E0;
      --op-chip-error-text: #cc1414;

      /* ---- Borders (dark-green tinted, never flat grey) ---- */
      --op-border-card: rgba(2, 56, 25, .12);
      --op-border-divider: rgba(2, 56, 25, .07);
      --op-border-input: rgba(2, 56, 25, .35);

      /* ---- Avatar fills (deterministic 4-cycle) ---- */
      --op-avatar-1-bg: #023819;
      --op-avatar-1-text: #BFFB4F;
      --op-avatar-2-bg: #BFFB4F;
      --op-avatar-2-text: #023819;
      --op-avatar-3-bg: #D1DBBD;
      --op-avatar-3-text: #023819;
      --op-avatar-4-bg: #FFCC1A;
      --op-avatar-4-text: #023819;

      /* ---- Typography ---- */
      --op-font-display: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --op-font-body: 'Open Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

      /* ---- Spacing — 4px base ---- */
      --op-space-1: 4px;
      --op-space-2: 8px;
      --op-space-3: 12px;
      --op-space-4: 16px;
      --op-space-6: 24px;
      --op-space-8: 40px;
      --op-space-10: 64px;

      /* ---- Radius ---- */
      --op-radius-sm: 6px;
      --op-radius-md: 8px;
      --op-radius-lg: 12px;
      --op-radius-xl: 16px;
      --op-radius-full: 999px;

      /* ---- Elevation (soft green-tinted shadows) ---- */
      --op-elevation-1: 0 1px 2px rgba(2, 56, 25, .05), 0 1px 3px rgba(2, 56, 25, .04);
      --op-elevation-2: 0 2px 4px rgba(2, 56, 25, .05), 0 8px 20px -8px rgba(2, 56, 25, .14);
      --op-elevation-3: 0 4px 8px rgba(2, 56, 25, .06), 0 18px 40px -16px rgba(2, 56, 25, .22);
      --op-elevation-hero: 0 20px 45px -22px rgba(2, 56, 25, .8);

      /* ---- Focus ring ---- */
      --op-focus-ring: 0 0 0 3px rgba(191, 251, 79, .4);
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    html, body { margin: 0; }

    body {
      background: var(--op-cream);
      color: var(--op-silver-dark);
      font-family: var(--op-font-body);
      font-size: 14px;
      line-height: 1.55;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }

    :focus-visible { outline: 2px solid var(--op-dark-green); outline-offset: 2px; }

    a { color: inherit; text-decoration: none; }

    button { font: inherit; cursor: pointer; }

    /* ---------- Layout ---------- */
    .app { display: flex; min-height: 100vh; }

    /* Backoffice module rail (matches Backoffice2.0 sidebar) */
    .rail {
      width: 64px;
      background: var(--op-dark-green);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--op-space-6) 0;
      gap: var(--op-space-2);
      flex-shrink: 0;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .rail-icon {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--op-radius-md);
      color: var(--op-light-green);
    }
    .rail-icon svg { width: 20px; height: 20px; }
    .rail-icon.active { background: var(--op-accent-lime); color: var(--op-dark-green); }
    .rail-icon:hover:not(.active) { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .rail-spacer { flex: 1; }

    .rail-avatar {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: var(--op-avatar-1-bg);
      color: var(--op-avatar-1-text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--op-font-display);
      font-weight: 600;
      font-size: 12px;
      margin-top: 4px;
    }

    .main {
      flex: 1;
      min-width: 0;
      padding: var(--op-space-6) 28px 40px;
    }

    .content { max-width: 1320px; }

    /* Top bar (matches Backoffice2.0) */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--op-space-3);
      min-height: 52px;
      margin-bottom: 18px;
    }

    .page-title {
      margin: 0;
      font-family: var(--op-font-display);
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -.015em;
      color: var(--op-dark-green);
      line-height: 1.15;
    }

    /* The logo file has a white background; multiply blends it into the cream page. */
    .brand-logo { display: block; height: 52px; width: auto; margin-left: auto; mix-blend-mode: multiply; }

    .page-header { margin-bottom: var(--op-space-6); }
    .page-header h1 {
      margin: 0 0 4px;
      font-family: var(--op-font-display);
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -.015em;
      color: var(--op-dark-green);
      line-height: 1.15;
    }

    .muted { color: var(--op-silver-light); margin: 0; font-size: 12.5px; }

    /* ---------- Spread cards (mini analytics) ---------- */
    .spread-cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--op-space-4);
      margin-bottom: var(--op-space-6);
    }
    .spread-card {
      background: var(--op-white);
      border: 1px solid var(--op-border-card);
      border-radius: var(--op-radius-xl);
      padding: var(--op-space-4) 18px 18px;
      box-shadow: var(--op-elevation-2);
    }
    .spread-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--op-silver-light);
      margin-bottom: var(--op-space-3);
    }
    .spread-total { display: flex; align-items: baseline; gap: 8px; margin-bottom: 14px; }
    .spread-total .stat-value { font-family: var(--op-font-display); font-size: 38px; font-weight: 600; line-height: 1; color: var(--op-dark-green); }
    .spread-total .unit { font-size: 12.5px; color: var(--op-silver-light); }

    .spread-bar {
      display: flex;
      gap: 2px;
      height: 10px;
      border-radius: var(--op-radius-full);
      overflow: hidden;
      background: var(--op-chip-neutral-bg);
      margin-bottom: 14px;
    }
    .spread-bar span { display: block; height: 100%; }

    .spread-legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .spread-legend li { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--op-silver-dark); }
    .spread-legend .swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
    .spread-legend .name { flex: 1; }
    .spread-legend .num { font-weight: 700; color: var(--op-dark-green); min-width: 20px; text-align: right; }
    .spread-legend .pct { color: var(--op-silver-light); font-size: 12px; min-width: 38px; text-align: right; }

    /* ---------- Toolbar ---------- */
    .toolbar .btn { margin-left: auto; white-space: nowrap; }
    .toolbar {
      display: flex;
      align-items: center;
      gap: var(--op-space-3);
      margin-bottom: var(--op-space-4);
      flex-wrap: wrap;
    }

    .search-input {
      flex: 0 1 460px;
      min-width: 220px;
      padding: 9px 12px;
      border-radius: var(--op-radius-md);
      border: 1.5px solid var(--op-border-input);
      font-size: 13.5px;
      font-family: inherit;
      background: var(--op-white);
      color: var(--op-dark-green);
    }
    .search-input:hover { border-color: var(--op-dark-green); }
    .search-input:focus-visible { border-color: var(--op-dark-green); border-width: 2px; padding: 8.5px 11.5px; box-shadow: var(--op-focus-ring); outline: none; }
    .search-input::placeholder { color: var(--op-silver-light); }

    /* ---------- Table ---------- */
    .table-wrap {
      background: var(--op-white);
      border: 1px solid var(--op-border-card);
      border-radius: var(--op-radius-xl);
      overflow-x: auto;
      box-shadow: var(--op-elevation-1);
    }

    .data-table { width: 100%; min-width: 900px; border-collapse: collapse; }
    .data-table th {
      text-align: left;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .09em;
      font-weight: 700;
      color: var(--op-silver-light);
      background: var(--op-chip-neutral-bg);
      padding: 12px 16px;
      border-bottom: 1px solid var(--op-border-card);
      white-space: nowrap;
    }
    .data-table td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--op-border-divider);
      font-size: 13.5px;
      vertical-align: middle;
      white-space: nowrap;
    }
    .data-table tbody tr { cursor: pointer; }
    .data-table tbody tr:last-child td { border-bottom: none; }
    .data-table tbody tr:hover { background: #F4F6EF; }

    .customer-cell { display: flex; align-items: center; gap: 10px; }
    .customer-name { font-weight: 700; color: var(--op-dark-green); }

    .table-empty { padding: 40px 16px; text-align: center; color: var(--op-silver-light); font-size: 13.5px; }

    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--op-space-3);
      padding: 12px 16px;
      border-top: 1px solid var(--op-border-card);
      color: var(--op-silver-light);
      font-size: 12.5px;
      background: var(--op-white);
      position: sticky;
      left: 0;
    }

    /* ---------- Avatars (deterministic squircles) ---------- */
    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--op-font-display);
      font-weight: 600;
      font-size: 12px;
      flex-shrink: 0;
    }
    .avatar.sm { width: 28px; height: 28px; border-radius: var(--op-radius-sm); font-size: 11px; }
    .avatar.lg { width: 62px; height: 62px; border-radius: 16px; font-size: 20px; }
    .avatar.fill-1 { background: var(--op-avatar-1-bg); color: var(--op-avatar-1-text); }
    .avatar.fill-2 { background: var(--op-avatar-2-bg); color: var(--op-avatar-2-text); }
    .avatar.fill-3 { background: var(--op-avatar-3-bg); color: var(--op-avatar-3-text); }
    .avatar.fill-4 { background: var(--op-avatar-4-bg); color: var(--op-avatar-4-text); }

    .owner-cell { display: flex; align-items: center; gap: 8px; }

    /* ---------- Chips ---------- */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      border-radius: var(--op-radius-sm);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .status-badge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }
    .status-active { background: var(--op-chip-success-bg); color: var(--op-chip-success-text); }
    .status-pending { background: var(--op-chip-warning-bg); color: var(--op-chip-warning-text); }
    /* Inactive is not an error, so it uses the neutral pair (red is reserved for overdue/failed). */
    .status-inactive { background: var(--op-chip-neutral-bg); color: var(--op-chip-neutral-text); }
    .status-inactive::before { background: var(--op-silver-light); }

    .class-chip {
      display: inline-flex;
      align-items: center;
      padding: 5px 11px;
      border-radius: var(--op-radius-sm);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .class-Enterprise { background: var(--op-dark-green); color: var(--op-accent-lime); }
    .class-SME { background: var(--op-light-green); color: var(--op-dark-green); }
    .class-Growth { background: var(--op-chip-neutral-bg); color: var(--op-dark-green); }

    /* ---------- Buttons ---------- */
    .view-btn {
      display: inline-flex;
      align-items: center;
      border: 1.5px solid var(--op-dark-green);
      background: var(--op-white);
      border-radius: var(--op-radius-md);
      padding: 6px 12px;
      font-family: var(--op-font-display);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--op-dark-green);
      white-space: nowrap;
      transition: background-color .16s, color .16s;
    }
    .view-btn:hover:not(:disabled) { background: var(--op-dark-green); color: var(--op-accent-lime); }
    .view-btn:disabled { background: #8FA08C; border-color: #8FA08C; color: var(--op-cream); cursor: not-allowed; }

    .btn-group { display: flex; gap: var(--op-space-2); }

    .text-link {
      font-weight: 700;
      font-size: 14px;
      color: var(--op-dark-green);
      border-bottom: 1.5px solid var(--op-dark-green);
    }
    .text-link:hover { color: var(--op-success); border-color: var(--op-success); }

    .back-link { display: inline-block; margin-bottom: var(--op-space-4); }

    /* ---------- Details ---------- */
    .hero {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      background: var(--op-dark-green);
      color: var(--op-cream);
      border-radius: var(--op-radius-xl);
      padding: var(--op-space-6);
      box-shadow: var(--op-elevation-hero);
    }
    .hero h1 {
      margin: 0 0 6px;
      font-family: var(--op-font-display);
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -.015em;
      line-height: 1.15;
      color: var(--op-cream);
    }
    .hero-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--op-light-green); }
    .hero-meta .dot { opacity: .5; }

    .detail-grid {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
      gap: var(--op-space-4);
      margin-top: var(--op-space-6);
      align-items: start;
    }
    .detail-col { display: flex; flex-direction: column; gap: var(--op-space-4); }

    .panel {
      background: var(--op-white);
      border: 1px solid var(--op-border-card);
      border-radius: var(--op-radius-xl);
      box-shadow: var(--op-elevation-2);
      padding: var(--op-space-6);
    }

    .panel-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 18px;
    }
    .panel-num { font-family: var(--op-font-display); font-size: 18px; color: #2f6b1e; }
    .panel-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--op-silver-light);
    }

    .fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px 24px;
    }
    .fields.single { grid-template-columns: 1fr; }

    .field-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .09em;
      color: var(--op-silver-light);
      margin-bottom: 4px;
    }
    .field-value { color: var(--op-dark-green); font-weight: 500; font-size: 14px; word-break: break-word; }
    .field-value .text-link { font-size: 13.5px; }

    .owner-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #F4F6EF;
      border: 1px solid rgba(2, 56, 25, .1);
      border-radius: 10px;
      padding: 9px 12px;
    }
    .owner-chip .name { font-weight: 700; font-size: 14px; color: var(--op-dark-green); }
    .owner-chip .role { font-size: 12px; color: var(--op-silver-light); }

    .panel-head.split { justify-content: space-between; align-items: center; }

    .field-group + .field-group {
      border-top: 1px solid var(--op-border-divider);
      margin-top: 22px;
      padding-top: 22px;
    }
    .group-title {
      font-family: var(--op-font-display);
      font-size: 14px;
      font-weight: 600;
      color: var(--op-dark-green);
      margin-bottom: 14px;
    }

    .side-col { display: flex; flex-direction: column; gap: var(--op-space-4); }

    /* ---------- Modal (matches Backoffice2.0) ---------- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 56, 25, .45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: var(--op-space-4);
    }
    .modal {
      background: var(--op-white);
      border-radius: var(--op-radius-xl);
      width: 100%;
      max-width: 460px;
      max-height: 90vh;
      overflow-y: auto;
      padding: var(--op-space-6);
      box-shadow: var(--op-elevation-3);
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
      gap: var(--op-space-3);
    }
    .modal-head h3 { margin: 0 0 4px; font-family: var(--op-font-display); font-weight: 600; font-size: 18px; color: var(--op-dark-green); }
    .modal-close { border: none; background: none; font-size: 22px; line-height: 1; color: var(--op-silver-light); padding: 2px 6px; }
    .modal-close:hover { color: var(--op-dark-green); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: var(--op-space-6); }

    /* Floating notched-label input — the OnePort 365 input foundation */
    .field { margin-bottom: 18px; }

    /* ---------- Add customer form ---------- */
    .form-panel { max-width: 880px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 20px; }
    .form-grid .span-2 { grid-column: 1 / -1; }
    .form-grid .field { margin-bottom: 12px; }
    .form-note {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      background: #F4F6EF;
      border: 1px solid rgba(2, 56, 25, .1);
      border-radius: var(--op-radius-lg);
      padding: 12px 14px;
      font-size: 13px;
      color: var(--op-silver-dark);
      margin-bottom: var(--op-space-6);
    }
    .form-note svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 2px; color: var(--op-dark-green); }
    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      border-top: 1px solid var(--op-border-divider);
      margin-top: 22px;
      padding-top: 22px;
    }
    .req { color: var(--op-error); }
    .op-input-wrap {
      position: relative;
      display: block;
      border: 1.5px solid var(--op-border-input);
      border-radius: var(--op-radius-md);
      padding: 15px 14px;
      background: var(--op-white);
    }
    .op-input-wrap:hover { border-color: var(--op-dark-green); }
    .op-input-wrap:focus-within { border: 2px solid var(--op-dark-green); padding: 14px 13px; box-shadow: var(--op-focus-ring); }
    .op-notch {
      position: absolute;
      top: -8px;
      left: 11px;
      background: var(--op-white);
      padding: 0 5px;
      font-size: 11px;
      font-weight: 600;
      color: var(--op-silver-light);
      pointer-events: none;
    }
    .op-input-wrap:hover .op-notch, .op-input-wrap:focus-within .op-notch { color: var(--op-dark-green); }
    .op-input-wrap.has-error { border: 2px solid var(--op-error); padding: 14px 13px; }
    .op-input-wrap.has-error .op-notch { color: var(--op-error); }
    .op-input-wrap.is-readonly { background: var(--op-chip-neutral-bg); border-color: var(--op-border-card); }
    .op-input-wrap.is-readonly .op-notch { background: var(--op-chip-neutral-bg); color: var(--op-silver-light); }
    .field input, .field select {
      border: none;
      outline: none;
      width: 100%;
      font-size: 14px;
      font-family: var(--op-font-body);
      color: var(--op-dark-green);
      background: transparent;
    }
    .field select { cursor: pointer; }
    .field input:disabled { color: var(--op-silver-dark); opacity: 1; -webkit-text-fill-color: var(--op-silver-dark); }
    .field-error { color: var(--op-error); font-size: 11.5px; margin-top: 6px; }

    .btn {
      border: none;
      border-radius: var(--op-radius-md);
      padding: 13px 18px;
      font-family: var(--op-font-display);
      font-size: 14px;
      font-weight: 600;
      transition: background-color .16s, color .16s;
    }
    .btn-primary { background: var(--op-accent-lime); color: var(--op-dark-green); }
    .btn-primary:hover { background: var(--op-accent-lime-hover); }
    .btn-outline { background: var(--op-white); border: 1.5px solid var(--op-dark-green); color: var(--op-dark-green); }
    .btn-outline:hover { background: var(--op-dark-green); color: var(--op-accent-lime); }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--op-dark-green);
      color: var(--op-cream);
      padding: 10px 18px;
      border-radius: var(--op-radius-md);
      font-weight: 600;
      font-size: 13px;
      box-shadow: var(--op-elevation-hero);
      z-index: 60;
      max-width: calc(100% - 32px);
    }

    .not-found {
      background: var(--op-white);
      border: 1px dashed var(--op-border-card);
      border-radius: var(--op-radius-xl);
      padding: 48px;
      text-align: center;
      color: var(--op-silver-light);
    }
    .not-found h2 { margin-top: 0; color: var(--op-dark-green); font-family: var(--op-font-display); font-weight: 600; }

    /* ---------- Detail tabs (matches Backoffice2.0 .tabs) ---------- */
    .tabs {
      display: flex;
      gap: 6px;
      border-bottom: 1px solid var(--op-border-card);
      margin: var(--op-space-6) 0;
    }
    .tab-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px var(--op-space-4);
      font-family: var(--op-font-display);
      font-size: 14px;
      font-weight: 500;
      color: var(--op-silver-light);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      white-space: nowrap;
    }
    .tab-btn svg { width: 15px; height: 15px; }
    .tab-btn:hover { color: var(--op-dark-green); }
    .tab-btn.active { color: var(--op-dark-green); border-bottom-color: var(--op-accent-lime); font-weight: 600; }

    /* ---------- KPI cards (deal + credit tabs) ---------- */
    .kpi-cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--op-space-4);
      margin-bottom: var(--op-space-4);
    }
    .kpi-card {
      background: var(--op-white);
      border: 1px solid var(--op-border-card);
      border-radius: var(--op-radius-xl);
      padding: var(--op-space-4);
      box-shadow: var(--op-elevation-2);
    }
    .kpi-card.highlight { background: var(--op-light-green); box-shadow: none; }
    .kpi-label { font-size: 12px; font-weight: 600; color: var(--op-silver-light); margin-bottom: var(--op-space-3); }
    .kpi-card.highlight .kpi-label { color: var(--op-dark-green); }
    .kpi-value { font-family: var(--op-font-display); font-size: 30px; font-weight: 600; line-height: 1.05; color: var(--op-dark-green); }
    .kpi-value.gold { color: #b38a00; }
    .kpi-value.error { color: var(--op-chip-error-text); }
    .kpi-value small { font-size: 15px; color: var(--op-silver-light); font-weight: 600; }
    .kpi-sub { font-size: 12.5px; color: var(--op-silver-light); margin-top: 8px; }

    .tab-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: var(--op-space-4);
      margin-bottom: var(--op-space-4);
      align-items: start;
    }

    .panel .spread-bar { margin-bottom: 14px; }

    .deal-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--op-space-3); }
    .deal-stat {
      background: #F4F6EF;
      border: 1px solid rgba(2, 56, 25, .1);
      border-radius: var(--op-radius-lg);
      padding: 14px;
    }
    .deal-stat.highlight { background: var(--op-light-green); border-color: transparent; }
    .deal-stat.highlight .kpi-label { color: var(--op-dark-green); }
    .deal-stat .kpi-value { font-size: 26px; }
    .panel-note { font-size: 13.5px; color: var(--op-silver-dark); margin: 0; }
    .panel-note + .panel-note { margin-top: 10px; }

    .insights { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
    .insights li { display: flex; gap: 10px; font-size: 13.5px; color: var(--op-silver-dark); }
    .insights li::before {
      content: "";
      width: 6px;
      height: 6px;
      margin-top: 8px;
      border-radius: 50%;
      background: var(--op-dark-green);
      flex-shrink: 0;
    }
    .insights strong { color: var(--op-dark-green); }

    .section-title {
      font-family: var(--op-font-display);
      font-size: 18px;
      font-weight: 600;
      color: var(--op-dark-green);
      margin: var(--op-space-6) 0 var(--op-space-3);
    }

    .money { font-weight: 700; color: var(--op-dark-green); }

    /* Stage / invoice chips reuse .status-badge with these semantic pairs */
    .chip-neutral { background: var(--op-chip-neutral-bg); color: var(--op-chip-neutral-text); }
    .chip-neutral::before { background: var(--op-silver-light); }
    .chip-success { background: var(--op-chip-success-bg); color: var(--op-chip-success-text); }
    .chip-warning { background: var(--op-chip-warning-bg); color: var(--op-chip-warning-text); }
    .chip-error { background: var(--op-chip-error-bg); color: var(--op-chip-error-text); }
    .chip-primary { background: var(--op-accent-lime); color: var(--op-dark-green); }

    /* Credit score */
    .score-wrap { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
    .score-value { font-family: var(--op-font-display); font-size: 56px; font-weight: 600; line-height: 1; letter-spacing: -.02em; color: var(--op-dark-green); }
    .score-value small { font-size: 18px; color: var(--op-silver-light); letter-spacing: 0; }
    .score-scale { position: relative; display: flex; gap: 2px; height: 10px; border-radius: var(--op-radius-full); overflow: hidden; }
    .score-scale span { flex: 1; }
    .score-marker-track { position: relative; height: 14px; margin-top: 4px; }
    .score-marker {
      position: absolute;
      top: 0;
      width: 0;
      height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-bottom: 9px solid var(--op-dark-green);
      transform: translateX(-7px);
    }
    .score-labels { display: flex; font-size: 11px; color: var(--op-silver-light); margin-top: 2px; }

    .meter { height: 10px; border-radius: var(--op-radius-full); background: var(--op-chip-neutral-bg); overflow: hidden; margin: 10px 0 8px; }
    .meter span { display: block; height: 100%; border-radius: var(--op-radius-full); }
    .meter-legend { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--op-silver-light); gap: 8px; }

    .empty-stub {
      background: var(--op-white);
      border: 1px dashed var(--op-border-card);
      border-radius: var(--op-radius-xl);
      padding: 48px 24px;
      text-align: center;
      color: var(--op-silver-light);
    }
    .empty-stub h3 { margin: 0 0 6px; color: var(--op-dark-green); font-family: var(--op-font-display); font-weight: 600; }
    .empty-stub p { margin: 0; }

    /* ---------- Responsive ---------- */
    @media (max-width: 1100px) {
      .spread-cards { grid-template-columns: 1fr; }
      .detail-grid { grid-template-columns: 1fr; }
      .kpi-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tab-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 760px) {
      .app { flex-direction: column; }
      .rail {
        width: 100%;
        height: auto;
        flex-direction: row;
        padding: 10px 16px;
        position: static;
      }
      .rail-avatar { margin-top: 0; }
      .main { padding: var(--op-space-4) 16px 40px; }
      .page-header h1, .hero h1, .page-title { font-size: 24px; }
      .brand-logo { height: 40px; }
      .search-input { flex: 1 1 100%; }
      .toolbar .btn { margin-left: 0; flex: 1; text-align: center; }
      .spread-total .stat-value { font-size: 30px; }
      .fields { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .form-actions .btn { flex: 1; }
      .panel, .hero { padding: var(--op-space-4); }
    }
  </style>
</head>

    // Account manager changes are kept in this browser until the page is wired to the API.
    const MANAGER_STORE_KEY = "op365.customers.accountManagers";

    function loadManagerChanges() {
      try {
        const saved = JSON.parse(localStorage.getItem(MANAGER_STORE_KEY) || "{}");
        customers.forEach((c) => {
          if (ACCOUNT_MANAGERS.includes(saved[c.id])) c.accountManager = saved[c.id];
        });
      } catch (e) { /* storage unavailable: keep the defaults */ }
    }

    function saveManagerChange(id, name) {
      try {
        const saved = JSON.parse(localStorage.getItem(MANAGER_STORE_KEY) || "{}");
        saved[id] = name;
        localStorage.setItem(MANAGER_STORE_KEY, JSON.stringify(saved));
      } catch (e) { /* storage unavailable: change lasts for this visit only */ }
    }

    // Customers added from the Add customer form are kept in this browser until the page is wired to the API.
    const ADDED_STORE_KEY = "op365.customers.added";

    function loadAddedCustomers() {
      try {
        const added = JSON.parse(localStorage.getItem(ADDED_STORE_KEY) || "[]");
        if (Array.isArray(added)) {
          added.filter((c) => c && c.id && !customers.some((x) => x.id === c.id)).forEach((c) => customers.unshift(c));
        }
      } catch (e) { /* storage unavailable: show the sample customers only */ }
    }

    function saveAddedCustomer(customer) {
      try {
        const added = JSON.parse(localStorage.getItem(ADDED_STORE_KEY) || "[]");
        added.push(customer);
        localStorage.setItem(ADDED_STORE_KEY, JSON.stringify(added));
      } catch (e) { /* storage unavailable: customer lasts for this visit only */ }
    }

    // Edits to customer basic information are kept in this browser until the page is wired to the API.
    const EDITS_STORE_KEY = "op365.customers.edits";
    const EDITABLE_KEYS = ["companyName", "rcNumber", "taxId", "industry", "customerClass", "address", "firstName", "lastName", "contactName", "email", "phone"];

    function loadCustomerEdits() {
      try {
        const edits = JSON.parse(localStorage.getItem(EDITS_STORE_KEY) || "{}");
        customers.forEach((c) => {
          const e = edits[c.id];
          if (e) EDITABLE_KEYS.forEach((k) => { if (typeof e[k] === "string") c[k] = e[k]; });
        });
      } catch (e) { /* storage unavailable: keep the defaults */ }
    }

    function saveCustomerEdit(c) {
      try {
        const edits = JSON.parse(localStorage.getItem(EDITS_STORE_KEY) || "{}");
        edits[c.id] = Object.fromEntries(EDITABLE_KEYS.map((k) => [k, c[k]]));

    const $ = (sel) => document.querySelector(sel);

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function initials(name) {
      return name.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join("");
    }

    // Deterministic avatar fill: the same name always gets the same brand fill (design system §08).
    function avatarFill(name) {
      let hash = 0;
      for (const ch of name) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
      return "fill-" + ((hash % 4) + 1);
    }

    function avatar(name, size = "") {
      return `<div class="avatar ${size} ${avatarFill(name)}" aria-hidden="true">${escapeHtml(initials(name))}</div>`;
    }

    function formatDate(iso) {
      return new Date(iso + "T00:00:00").toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
    }

    function statusBadge(status) {
      return `<span class="status-badge status-${status}">${STATUS_LABELS[status] || escapeHtml(status)}</span>`;
    }

    function parseRoute() {
      const hash = location.hash.replace(/^#/, "") || "/customers";
      return hash.split("?")[0].split("/").filter(Boolean);
    }

    function classChip(customerClass) {

    // ---------------------------------------------------------------
    // Sample deal + credit data.
    // Generated deterministically from the customer ID so every customer
    // shows stable figures. Replace with API calls when the backend is ready.
    // ---------------------------------------------------------------
    const TODAY = new Date("2026-09-29T00:00:00");
    const DAY = 86400000;

    function seededRandom(seed) {
      let h = 1779033703 ^ seed.length;
      for (const ch of seed) { h = Math.imul(h ^ ch.charCodeAt(0), 3432918353); h = (h << 13) | (h >>> 19); }
      return () => {
        h = Math.imul(h ^ (h >>> 16), 2246822507);
        h = Math.imul(h ^ (h >>> 13), 3266489909);
        h ^= h >>> 16;
        return (h >>> 0) / 4294967296;
      };
    }

    const pick = (rand, list) => list[Math.floor(rand() * list.length)];
    const between = (rand, min, max) => min + Math.floor(rand() * (max - min + 1));
    const isoDate = (d) => d.toISOString().slice(0, 10);

    const OPEN_STAGES = ["Prospect", "Contacted", "Qualified", "Quote issued"];

    const DEAL_VALUE_RANGE = { Enterprise: [18000, 120000], SME: [3000, 24000], Growth: [800, 9000] };

    const cache = new Map();

    function dealsFor(c) {
      if (c.addedInBackoffice) return [];
      if (cache.has("deals:" + c.id)) return cache.get("deals:" + c.id);
      const rand = seededRandom(c.id + ":deals");
      const count = c.status === "active" ? between(rand, 6, 10) : c.status === "pending" ? between(rand, 1, 3) : between(rand, 3, 5);
      const start = new Date(c.createdAt + "T00:00:00").getTime();
      // Inactive customers stopped trading a while ago.
      const end = c.status === "inactive" ? start + 300 * DAY : TODAY.getTime() - 3 * DAY;
      const [minV, maxV] = DEAL_VALUE_RANGE[c.customerClass];

      const deals = [];
      for (let i = 0; i < count; i++) {
        const created = new Date(start + rand() * (end - start));
        const ageDays = (TODAY - created) / DAY;
        let stage;
        if (c.status === "pending") stage = pick(rand, ["Prospect", "Contacted", "Qualified"]);
        else if (ageDays > 90 || c.status === "inactive") stage = rand() < 0.68 ? "Won" : "Lost";
        else stage = pick(rand, OPEN_STAGES);
        deals.push({
          id: `DL-${c.id.slice(4)}${String(i + 1).padStart(2, "0")}`,
          value: Math.round((minV + rand() * (maxV - minV)) / 10) * 10,
          stage,
          createdAt: isoDate(created)
        });
      }
      deals.sort((a, b) => b.createdAt.localeCompare(a.createdAt));
      cache.set("deals:" + c.id, deals);
      return deals;
    }

    const CREDIT_LIMITS = { Enterprise: [150000, 400000], SME: [20000, 80000], Growth: [5000, 20000] };

    function creditFor(c) {
      if (cache.has("credit:" + c.id)) return cache.get("credit:" + c.id);
      // No credit history yet: still onboarding, or just added in the backoffice.
      if (c.status === "pending" || c.addedInBackoffice) { cache.set("credit:" + c.id, null); return null; }

      const rand = seededRandom(c.id + ":credit");
      // Chance an invoice is paid on time; inactive accounts skew towards weaker payment histories.
      const reliability = c.status === "inactive" ? 0.2 + rand() * 0.35 : 0.3 + rand() * 0.68;
      const terms = pick(rand, c.customerClass === "Enterprise" ? [45, 60] : [30, 45]);
      const [minL, maxL] = CREDIT_LIMITS[c.customerClass];
      const limit = Math.round((minL + rand() * (maxL - minL)) / 5000) * 5000;
      const [minV, maxV] = DEAL_VALUE_RANGE[c.customerClass];

      // Last 8 monthly invoices, ending today (or when an inactive customer stopped trading).
      const lastIssue = c.status === "inactive"
        ? new Date(new Date(c.createdAt + "T00:00:00").getTime() + 300 * DAY)
        : new Date(TODAY.getTime() - 12 * DAY);
      const invoices = [];
      for (let i = 0; i < 8; i++) {
        const issued = new Date(lastIssue.getTime() - i * 30 * DAY - between(rand, 0, 6) * DAY);
        const due = new Date(issued.getTime() + terms * DAY);
        const amount = Math.round((minV + rand() * (maxV - minV) * 0.8) / 10) * 10;
        let paid = null;
        let status;
        const roll = rand();
        if (due > TODAY) {
          status = "Outstanding";
          if (roll < 0.3) { paid = new Date(issued.getTime() + between(rand, 5, terms - 2) * DAY); status = "Paid on time"; }
        } else if (roll < reliability) {
          paid = new Date(due.getTime() - between(rand, 0, 10) * DAY);
          status = "Paid on time";
        } else if (roll < reliability + (1 - reliability) * 0.75) {
          paid = new Date(due.getTime() + between(rand, 3, 28) * DAY);
          status = "Paid late";
        } else {
          status = "Overdue";
        }
        invoices.push({
          id: `INV-${c.id.slice(4)}-${String(8 - i).padStart(2, "0")}`,
          amount, issued: isoDate(issued), due: isoDate(due), paid: paid ? isoDate(paid) : null, status
        });
      }

      const settled = invoices.filter((inv) => inv.paid);
      const onTime = invoices.filter((inv) => inv.status === "Paid on time").length;
      const late = invoices.filter((inv) => inv.status === "Paid late").length;
      const overdue = invoices.filter((inv) => inv.status === "Overdue");
      const outstanding = invoices.filter((inv) => inv.status === "Outstanding");
      const judged = onTime + late + overdue.length;
      const onTimeRate = judged ? onTime / judged : 1;
      const avgDaysToPay = settled.length
        ? Math.round(settled.reduce((sum, inv) => sum + (new Date(inv.paid) - new Date(inv.issued)) / DAY, 0) / settled.length)
        : 0;
      const overdueAmount = overdue.reduce((s, inv) => s + inv.amount, 0);
      const used = Math.min(limit, overdueAmount + outstanding.reduce((s, inv) => s + inv.amount, 0));
      const tenureYears = (TODAY - new Date(c.createdAt + "T00:00:00")) / (365 * DAY);

      let score = 35 + onTimeRate * 50 + Math.min(tenureYears, 2) * 5 - overdue.length * 9 - (used / limit > 0.8 ? 6 : 0);
      if (c.status === "inactive") score -= 12;
      score = Math.max(5, Math.min(98, Math.round(score)));

      const credit = { limit, used, terms, invoices, onTime, late, overdue, outstanding, onTimeRate, avgDaysToPay, overdueAmount, score };
      cache.set("credit:" + c.id, credit);
      return credit;
    }

    function money(n) {
      return "$" + Math.round(n).toLocaleString("en-US");
    }

    function compactMoney(n) {
      if (n >= 1e6) return "$" + (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
      if (n >= 1e3) return "$" + (n / 1e3).toFixed(1).replace(/\.0$/, "") + "k";
      return money(n);
    }

    function openManagerDialog(c, trigger) {
      const others = ACCOUNT_MANAGERS.filter((name) => name !== c.accountManager);
      const overlay = document.createElement("div");
      overlay.className = "modal-overlay";
      overlay.innerHTML = `
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="am-title">
          <div class="modal-head">
            <div>
              <h3 id="am-title">Change account manager</h3>
              <p class="muted">${escapeHtml(c.companyName)}</p>
            </div>
            <button class="modal-close" type="button" aria-label="Close" data-close>×</button>
          </div>
          <form id="am-form" novalidate>
            <div class="field">
              <label class="op-input-wrap is-readonly">
                <span class="op-notch">Current account manager</span>
                <input type="text" value="${escapeHtml(c.accountManager)}" disabled />
              </label>
            </div>
            <div class="field" style="margin-bottom: 0">
              <label class="op-input-wrap" id="am-wrap">
                <span class="op-notch">New account manager <span class="req">*</span></span>
                <select id="am-select" aria-describedby="am-error">
                  <option value="">Select an account manager</option>
                  ${others.map((name) => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`).join("")}
                </select>
              </label>
              <div class="field-error" id="am-error" hidden>Select the new account manager.</div>
            </div>
            <div class="modal-actions">
              <button class="btn btn-outline" type="button" data-close>Cancel</button>
              <button class="btn btn-primary" type="submit">Save changes</button>
            </div>
          </form>
        </div>
      `;
      document.body.appendChild(overlay);

      const select = overlay.querySelector("#am-select");
      const wrap = overlay.querySelector("#am-wrap");
      const error = overlay.querySelector("#am-error");

      function close() {
        document.removeEventListener("keydown", onKey);
        overlay.remove();
        trigger?.focus();
      }

      function onKey(e) {
        if (e.key === "Escape") { close(); return; }
        if (e.key !== "Tab") return;
        // Keep keyboard focus inside the dialog.
        const focusable = [...overlay.querySelectorAll("button, select")];
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }

      document.addEventListener("keydown", onKey);
      overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
      overlay.querySelectorAll("[data-close]").forEach((btn) => btn.addEventListener("click", close));

      select.addEventListener("change", () => {
        wrap.classList.remove("has-error");
        error.hidden = true;
      });

      overlay.querySelector("#am-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const name = select.value;
        if (!name) {
          wrap.classList.add("has-error");
          error.hidden = false;
          select.focus();
          return;
        }
        c.accountManager = name;
        saveManagerChange(c.id, name);
        document.removeEventListener("keydown", onKey);
        overlay.remove();
        router();
        $("#change-manager")?.focus();
        showToast(`${name} is now the account manager for ${c.companyName}`);
      });

      select.focus();
    }

    const INVOICE_CHIPS = {
      "Paid on time": "chip-success",
      "Paid late": "chip-warning",
      "Overdue": "chip-error",
      "Outstanding": "chip-neutral"
    };

    function creditRating(score) {
      // Readiness-style scale from the design system: low → error, building → warning, ready → success.
      if (score >= 80) return { label: "Excellent", chip: "chip-success", advice: "Low risk. Eligible for a limit increase on request." };
      if (score >= 65) return { label: "Good", chip: "chip-success", advice: "Low risk. Maintain the current limit and terms." };
      if (score >= 45) return { label: "Fair", chip: "chip-warning", advice: "Moderate risk. Keep the limit under review and follow up on late payments." };
      return { label: "Poor", chip: "chip-error", advice: "High risk. Hold new credit until overdue invoices are cleared." };
    }

    function renderCreditTab(c) {
      const credit = creditFor(c);
      if (!credit) {
        return `
          <div class="empty-stub">
            <h3>${c.addedInBackoffice ? "No credit history yet" : "Credit assessment in progress"}</h3>
            <p>${c.addedInBackoffice
              ? `${escapeHtml(c.companyName)} has no credit history yet. A credit score and limit will appear here once the credit assessment is complete.`
              : `${escapeHtml(c.companyName)} is still being onboarded. A credit score and limit will appear here once the assessment is complete.`}</p>
          </div>
        `;
      }

      const rating = creditRating(credit.score);
      const utilisation = Math.round((credit.used / credit.limit) * 100);
      const utilColor = utilisation > 80 ? "#FF1A1A" : utilisation > 60 ? "#FFCC1A" : "#1F8A5B";
      const onTimePct = Math.round(credit.onTimeRate * 100);
      const judged = credit.onTime + credit.late + credit.overdue.length;

      const paymentRows = [
        { label: "Paid on time", color: "#1F8A5B", count: credit.onTime },
        { label: "Paid late", color: "#FFCC1A", count: credit.late },
        { label: "Overdue", color: "#FF1A1A", count: credit.overdue.length },
        { label: "Not yet due", color: "#D1DBBD", count: credit.outstanding.length }
      ];

      const overview = [
        `Pays <strong>${onTimePct}%</strong> of invoices on time (${credit.onTime} of ${judged}), taking <strong>${credit.avgDaysToPay} days</strong> on average against Net ${credit.terms} terms.`,
        credit.overdue.length
          ? `<strong>${credit.overdue.length} overdue ${credit.overdue.length === 1 ? "invoice" : "invoices"}</strong> totalling ${money(credit.overdueAmount)}.`
          : `No overdue invoices.`,
        `Using <strong>${utilisation}%</strong> of the ${money(credit.limit)} credit limit.`,
        `<strong>Recommendation:</strong> ${rating.advice}`
      ];

      return `
        <section class="kpi-cards">
          ${kpi("Credit limit", compactMoney(credit.limit), `Net ${credit.terms} payment terms`, "highlight")}
          ${kpi("Available credit", compactMoney(credit.limit - credit.used), `${compactMoney(credit.used)} in use`)}
          ${kpi("On-time payments", `${onTimePct}<small>%</small>`, `Avg. ${credit.avgDaysToPay} days to pay`)}
          ${kpi("Overdue", compactMoney(credit.overdueAmount), credit.overdue.length ? `${credit.overdue.length} ${credit.overdue.length === 1 ? "invoice" : "invoices"} past due` : "Nothing past due", credit.overdueAmount ? "error" : "")}
        </section>

        <div class="tab-grid">
          <section class="panel">
            ${panelHead("01", "Creditworthiness")}
            <div class="score-wrap">
              <div class="score-value">${credit.score}<small>/100</small></div>
              <div style="padding-bottom: 8px">${chip(rating.label, rating.chip)}</div>
            </div>
            <div class="score-scale" aria-hidden="true">
              <span style="flex: 45; background: #FDE0E0"></span>
              <span style="flex: 20; background: #FFF3CC"></span>
              <span style="flex: 15; background: #E1F1E8"></span>
              <span style="flex: 20; background: #B9DEC9"></span>
            </div>
            <div class="score-marker-track" aria-hidden="true"><span class="score-marker" style="left: ${credit.score}%"></span></div>
            <div class="score-labels"><span style="flex: 45">Poor</span><span style="flex: 20">Fair</span><span style="flex: 15">Good</span><span style="flex: 20; text-align: right">Excellent</span></div>

            <div style="margin-top: 22px">
              <div class="field-label">Credit utilisation</div>
              <div class="meter" role="img" aria-label="Credit utilisation ${utilisation}%"><span style="width: ${utilisation}%; background: ${utilColor}"></span></div>
              <div class="meter-legend"><span>${money(credit.used)} used · ${utilisation}%</span><span>${money(credit.limit)} limit</span></div>
            </div>
          </section>

          <div class="detail-col">
            <section class="panel">
              ${panelHead("02", "Payment behaviour")}
              ${segmentBar(paymentRows, "Invoices by payment status")}
            </section>
            <section class="panel">
              ${panelHead("03", "Overview")}
              <ul class="insights">${overview.map((i) => `<li><span>${i}</span></li>`).join("")}</ul>
            </section>
          </div>
        </div>

        <h2 class="section-title">Recent invoices</h2>
        <div class="table-wrap">
          <table class="data-table" style="min-width: 720px">
            <thead>
              <tr>
                <th>Invoice</th>
                <th>Amount (USD)</th>
                <th>Issued</th>
                <th>Due</th>
                <th>Paid</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              ${credit.invoices.map((inv) => `
                <tr style="cursor: default">
                  <td>${escapeHtml(inv.id)}</td>
                  <td><span class="money">${money(inv.amount)}</span></td>
                  <td>${formatDate(inv.issued)}</td>
                  <td>${formatDate(inv.due)}</td>
                  <td>${inv.paid ? formatDate(inv.paid) : "–"}</td>
                  <td>${chip(inv.status, INVOICE_CHIPS[inv.status])}</td>
                </tr>`).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderDetails(id, tabKey) {
      const c = customers.find((x) => x.id === id);

      if (!c) {
          $("#view").innerHTML = `
          <a class="text-link back-link" href="#/customers">← Back to all customers</a>
          <div class="not-found">
            <h2>Customer not found</h2>
            <p>No customer with ID <strong>${escapeHtml(id)}</strong> exists.</p>
          </div>
        `;
        return;
      }

      const tab = DETAIL_TABS.find((t) => t.key === tabKey) || DETAIL_TABS[0];
      const base = `#/customers/${encodeURIComponent(c.id)}`;

      const body = tab.key === "credit" ? renderCreditTab(c) : renderBasicTab(c);

      $("#view").innerHTML = `
        <a class="text-link back-link" href="#/customers">← Back to all customers</a>

        <section class="hero">
          ${avatar(c.companyName, "lg")}
          <div>
            <h1>${escapeHtml(c.companyName)}</h1>
            <div class="hero-meta">
              ${statusBadge(c.status)}
              ${classChip(c.customerClass)}
              <span>Customer since ${formatDate(c.createdAt)}</span>
            </div>
          </div>
        </section>

        <nav class="tabs" aria-label="Customer sections">
          ${DETAIL_TABS.map((t) => `
            <a class="tab-btn ${t.key === tab.key ? "active" : ""}" href="${t.key === "basic" ? base : `${base}/${t.key}`}" ${t.key === tab.key ? 'aria-current="page"' : ""}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${t.icon}</svg>
              ${t.label}
            </a>`).join("")}
        </nav>

        ${body}
      `;

      const changeBtn = $("#change-manager");
      if (changeBtn) changeBtn.addEventListener("click", () => openManagerDialog(c, changeBtn));
    }

    // ---------------------------------------------------------------
    // Add customer
    // ---------------------------------------------------------------
    const INDUSTRIES = [
      "Agriculture", "Automotive", "Food & Beverage", "General Trading", "Heavy Machinery",
      "Logistics", "Oil & Gas", "Pharmaceuticals", "Textiles", "Other"
    ];
    const CLASSES = ["Growth", "SME", "Enterprise"];

    // Order follows the agreed onboarding flow. Registration channel is set by the system, not the form.
    const ADD_FIELDS = [
      { group: "Company", id: "companyName", label: "Company name", required: true, autocomplete: "organization", placeholder: "e.g. Adeola Foods Ltd", span: true },
      { group: "Company", id: "rcNumber", label: "RC number", required: true, message: "Enter the RC number.", placeholder: "e.g. RC 1234567" },
      { group: "Company", id: "taxId", label: "Tax ID", required: true, message: "Enter the tax ID.", placeholder: "e.g. TIN 20394857-0001" },
      { group: "Company", id: "industry", label: "Industry (optional)", options: INDUSTRIES, placeholderOption: "Select industry" },
      { group: "Company", id: "customerClass", label: "Class", required: true, message: "Select the customer class.", options: CLASSES },
      { group: "Company", id: "address", label: "Company address", required: true, autocomplete: "street-address", placeholder: "Street, city, country", span: true },
      { group: "Primary contact", id: "firstName", label: "First name", required: true, message: "Enter the primary contact's first name.", autocomplete: "given-name" },
      { group: "Primary contact", id: "lastName", label: "Last name", required: true, message: "Enter the primary contact's last name.", autocomplete: "family-name" },
      { group: "Primary contact", id: "email", label: "Email address", required: true, type: "email", autocomplete: "email", placeholder: "name@company.com" },
      { group: "Primary contact", id: "phone", label: "Phone number", required: true, type: "tel", autocomplete: "tel", placeholder: "+234 800 000 0000" },
      { group: "Account manager", id: "accountManager", label: "Account manager", required: true, options: ACCOUNT_MANAGERS }
    ];

    function formField(f) {
      const notch = `<span class="op-notch">${escapeHtml(f.label)}${f.required ? ' <span class="req">*</span>' : ""}</span>`;
      const aria = `aria-describedby="err-${f.id}" ${f.required ? 'aria-required="true"' : ""}`;
      const control = f.options
        ? `<select id="f-${f.id}" name="${f.id}" ${aria}>
             <option value="">${escapeHtml(f.placeholderOption || `Select ${f.label.toLowerCase()}`)}</option>
             ${f.options.map((o) => `<option value="${escapeHtml(o)}" ${o === f.value ? "selected" : ""}>${escapeHtml(o)}</option>`).join("")}
           </select>`
        : `<input id="f-${f.id}" name="${f.id}" type="${f.type || "text"}" ${f.autocomplete ? `autocomplete="${f.autocomplete}"` : ""} placeholder="${escapeHtml(f.placeholder || "")}" value="${escapeHtml(f.value || "")}" ${aria} />`;
      return `
        <div class="field ${f.span ? "span-2" : ""}">
          <label class="op-input-wrap" id="wrap-${f.id}">${notch}${control}</label>
          <div class="field-error" id="err-${f.id}" hidden></div>
        </div>
      `;
    }

    function validateCustomer(values, fields, self = null) {
      const errors = {};
      const others = customers.filter((c) => c !== self);
      fields.forEach((f) => {
        if (f.required && !values[f.id]) errors[f.id] = f.message || `${f.options ? "Select" : "Enter"} the ${f.label.toLowerCase()}.`;
      });

      if (values.companyName && others.some((c) => c.companyName.toLowerCase() === values.companyName.toLowerCase())) {
        errors.companyName = "A customer with this company name already exists.";
      }
      if (values.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(values.email)) {
        errors.email = "Enter a valid email address, like name@company.com.";
      } else if (values.email && others.some((c) => c.email.toLowerCase() === values.email.toLowerCase())) {
        errors.email = "Another customer already uses this email.";
      }
      if (values.phone && !/^\+?[0-9][0-9\s()-]{6,19}$/.test(values.phone)) {
        errors.phone = "Enter a valid phone number, including the country code.";
      }
      return errors;
    }

    function nextCustomerId() {
      const max = customers.reduce((m, c) => Math.max(m, Number(c.id.replace(/\D/g, "")) || 0), 1000);
      return `CUS-${max + 1}`;
    }

    // Sample customers only have a full contact name; split it for the edit form.
    function contactNameParts(c) {
      if (c.firstName || c.lastName) return { firstName: c.firstName || "", lastName: c.lastName || "" };
      const [first, ...rest] = c.contactName.split(/\s+/);
      return { firstName: first || "", lastName: rest.join(" ") };
    }

    // Shared by Add customer and Edit customer. `existing` is the customer being edited, if any.
    function renderCustomerForm(existing = null) {
      const editing = Boolean(existing);
      // Account manager has its own Change flow on the details page, so it is only asked for on Add.
      const fields = (editing ? ADD_FIELDS.filter((f) => f.id !== "accountManager") : ADD_FIELDS).map((f) => {
        if (!editing) return f;
        const initial = { ...existing, ...contactNameParts(existing) }[f.id];
        return { ...f, value: f.id === "industry" && !INDUSTRIES.includes(initial) ? "" : initial };
      });
      const groups = [...new Set(fields.map((f) => f.group))];
      const backHref = editing ? `#/customers/${encodeURIComponent(existing.id)}` : "#/customers";

      $("#view").innerHTML = `
        <a class="text-link back-link" href="${backHref}">← ${editing ? `Back to ${escapeHtml(existing.companyName)}` : "Back to all customers"}</a>
        <div class="page-header">
          <h1>${editing ? "Edit customer" : "Add customer"}</h1>
          <p class="muted">${editing ? `Update the basic information for ${escapeHtml(existing.companyName)}. ` : ""}Fields marked <span class="req">*</span> are required.</p>
        </div>

        <form class="panel form-panel" id="customer-form" novalidate>
          ${editing ? "" : `
          <div class="form-note">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
            <span>Customers added here are created as <strong>Active</strong>.</span>
          </div>`}
          ${groups.map((g) => `
            <div class="field-group">
              <div class="group-title">${escapeHtml(g)}</div>
              <div class="form-grid">${fields.filter((f) => f.group === g).map(formField).join("")}</div>
            </div>`).join("")}
          <div class="form-actions">
            <a class="btn btn-outline" href="${backHref}">Cancel</a>
            <button class="btn btn-primary" type="submit">${editing ? "Save changes" : "Add customer"}</button>
          </div>
        </form>
      `;

      function setError(id, message) {
        const wrap = $("#wrap-" + id);
        const err = $("#err-" + id);
        const control = $("#f-" + id);
        wrap.classList.toggle("has-error", Boolean(message));
        err.hidden = !message;
        err.textContent = message || "";
        if (message) control.setAttribute("aria-invalid", "true"); else control.removeAttribute("aria-invalid");
      }

      const readValues = () => Object.fromEntries(fields.map((f) => [f.id, $("#f-" + f.id).value.trim()]));

      // Clear a field's error as soon as it is corrected.
      fields.forEach((f) => {
        $("#f-" + f.id).addEventListener(f.options ? "change" : "input", () => {
          if (!$("#wrap-" + f.id).classList.contains("has-error")) return;
          setError(f.id, validateCustomer(readValues(), fields, existing)[f.id]);
        });
      });

      $("#customer-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const values = readValues();
        const errors = validateCustomer(values, fields, existing);
        fields.forEach((f) => setError(f.id, errors[f.id]));

        const firstInvalid = fields.find((f) => errors[f.id]);
        if (firstInvalid) {
          $("#f-" + firstInvalid.id).focus();
          return;
        }

        const basics = {
          companyName: values.companyName,
          rcNumber: values.rcNumber,
          taxId: values.taxId,
          industry: values.industry || "Not provided",
          customerClass: values.customerClass,
          address: values.address,
          firstName: values.firstName,
          lastName: values.lastName,
          contactName: `${values.firstName} ${values.lastName}`,
          email: values.email,
          phone: values.phone
        };

        if (editing) {
          Object.assign(existing, basics);
          saveCustomerEdit(existing);
          location.hash = backHref;
          showToast(`${existing.companyName} was updated`);
          return;
        }

        const customer = {
          id: nextCustomerId(),
          ...basics,
          channel: "Internal", // set by the system for customers added in the backoffice
          status: "active", // customers created internally are active straight away
          accountManager: values.accountManager,
          createdAt: isoDate(new Date()),
          addedInBackoffice: true
        };
        customers.unshift(customer);
        saveAddedCustomer(customer);
        location.hash = `#/customers/${encodeURIComponent(customer.id)}`;
        showToast(`${customer.companyName} was added as a new customer`);
      });

      $("#f-companyName").focus();
    }

    // ---------------------------------------------------------------
    // Router
    // ---------------------------------------------------------------
    let lastCustomerId = null;

    function router() {
      const parts = parseRoute();
      // Only the list page shows its title in the top bar; other pages have their own headings.
      $("#topbar-title").innerHTML = parts[0] === "customers" && !parts[1] ? '<h1 class="page-title">Customers</h1>' : "";

      if (parts[0] !== "customers") {
        location.hash = "#/customers";
        return;
      }

      const customerId = parts[1] ? decodeURIComponent(parts[1]) : null;
      // Keep scroll position when switching tabs on the same customer.
      if (customerId !== lastCustomerId) window.scrollTo(0, 0);
      lastCustomerId = customerId;

      const editTarget = parts[2] === "edit" ? customers.find((c) => c.id === customerId) : null;

      if (customerId === "new") {
        renderCustomerForm();
      } else if (editTarget) {
        renderCustomerForm(editTarget);
      } else if (customerId) {
        renderDetails(customerId, parts[2]);
      } else {
        renderList();
      }
    }

    window.addEventListener("hashchange", router);
    router();
  </script>
</body>
</html>
