<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OnePort365 Backoffice · Customers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Open+Sans:wght@400;500;700&display=swap" />
  <style>
    /*
      OnePort 365 — design tokens.
      Copied from Backoffice2.0/design/tokens.css (source of truth: DESIGN_SYSTEM.md).
      Do not hand-roll new colors/fonts elsewhere.
    */
    :root {
      /* ---- Brand colour ---- */
      --op-dark-green: #023819;
      --op-light-green: #D1DBBD;
      --op-accent-lime: #BFFB4F;
      --op-accent-lime-hover: #a9e83a;
      --op-gold: #FFCC1A;
      --op-white: #FFFFFF;
      --op-cream: #FDFBF1;
      --op-silver-light: #808080;
      --op-silver-dark: #383838;
      --op-error: #FF1A1A;
      --op-success: #1F8A5B;

      /* ---- Semantic chip pairs (bg / text) ---- */
      --op-chip-neutral-bg: #EDEFE8;
      --op-chip-neutral-text: #4a5a3f;
      --op-chip-success-bg: #E1F1E8;
      --op-chip-success-text: #0f7a45;
      --op-chip-warning-bg: #FFF3CC;
      --op-chip-warning-text: #8a6a00;
      --op-chip-error-bg: #FDE0E0;
      --op-chip-error-text: #cc1414;

      /* ---- Borders (dark-green tinted, never flat grey) ---- */
      --op-border-card: rgba(2, 56, 25, .12);
      --op-border-divider: rgba(2, 56, 25, .07);
      --op-border-input: rgba(2, 56, 25, .35);

      /* ---- Avatar fills (deterministic 4-cycle) ---- */
      --op-avatar-1-bg: #023819;
      --op-avatar-1-text: #BFFB4F;
      --op-avatar-2-bg: #BFFB4F;
      --op-avatar-2-text: #023819;
      --op-avatar-3-bg: #D1DBBD;
      --op-avatar-3-text: #023819;
      --op-avatar-4-bg: #FFCC1A;
      --op-avatar-4-text: #023819;

      /* ---- Typography ---- */
      --op-font-display: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --op-font-body: 'Open Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

      /* ---- Spacing — 4px base ---- */
      --op-space-1: 4px;
      --op-space-2: 8px;
      --op-space-3: 12px;
      --op-space-4: 16px;
      --op-space-6: 24px;
      --op-space-8: 40px;
      --op-space-10: 64px;

      /* ---- Radius ---- */
      --op-radius-sm: 6px;
      --op-radius-md: 8px;
      --op-radius-lg: 12px;
      --op-radius-xl: 16px;
      --op-radius-full: 999px;

      /* ---- Elevation (soft green-tinted shadows) ---- */
      --op-elevation-1: 0 1px 2px rgba(2, 56, 25, .05), 0 1px 3px rgba(2, 56, 25, .04);
      --op-elevation-2: 0 2px 4px rgba(2, 56, 25, .05), 0 8px 20px -8px rgba(2, 56, 25, .14);
      --op-elevation-3: 0 4px 8px rgba(2, 56, 25, .06), 0 18px 40px -16px rgba(2, 56, 25, .22);
      --op-elevation-hero: 0 20px 45px -22px rgba(2, 56, 25, .8);

      /* ---- Focus ring ---- */
      --op-focus-ring: 0 0 0 3px rgba(191, 251, 79, .4);
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    html, body { margin: 0; }

    body {
      background: var(--op-cream);
      color: var(--op-silver-dark);
      font-family: var(--op-font-body);
      font-size: 14px;
      line-height: 1.55;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }

    :focus-visible { outline: 2px solid var(--op-dark-green); outline-offset: 2px; }

    a { color: inherit; text-decoration: none; }

    button { font: inherit; cursor: pointer; }

    /* ---------- Layout ---------- */
    .app { display: flex; min-height: 100vh; }

    /* Backoffice module rail (matches Backoffice2.0 sidebar) */
    .rail {
      width: 64px;
      background: var(--op-dark-green);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--op-space-6) 0;
      gap: var(--op-space-2);
      flex-shrink: 0;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .rail-icon {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--op-radius-md);
      color: var(--op-light-green);
    }
    .rail-icon svg { width: 20px; height: 20px; }
    .rail-icon.active { background: var(--op-accent-lime); color: var(--op-dark-green); }
    .rail-icon:hover:not(.active) { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .rail-spacer { flex: 1; }

    .rail-avatar {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: var(--op-avatar-1-bg);
      color: var(--op-avatar-1-text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--op-font-display);
      font-weight: 600;
      font-size: 12px;
      margin-top: 4px;
    }

    .main {
      flex: 1;
      min-width: 0;
      padding: var(--op-space-6) 28px 40px;
    }

    .content { max-width: 1320px; }

    /* Top bar (matches Backoffice2.0) */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--op-space-3);
      margin-bottom: 18px;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-weight: 600;
      color: var(--op-silver-light);
      font-size: 13px;
    }
    .breadcrumb a:hover { color: var(--op-dark-green); }
    .breadcrumb strong { color: var(--op-dark-green); }

    .brand {
      font-family: var(--op-font-display);
      font-weight: 700;
      color: var(--op-dark-green);
      font-size: 15px;
      white-space: nowrap;
    }
    .brand span { color: var(--op-accent-lime); -webkit-text-stroke: 0.4px var(--op-dark-green); }

    .page-header { margin-bottom: var(--op-space-6); }
    .page-header h1 {
      margin: 0 0 4px;
      font-family: var(--op-font-display);
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -.015em;
      color: var(--op-dark-green);
      line-height: 1.15;
    }

    .muted { color: var(--op-silver-light); margin: 0; font-size: 12.5px; }

    /* ---------- Spread cards (mini analytics) ---------- */
    .spread-cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--op-space-4);
      margin-bottom: var(--op-space-6);
    }
    .spread-card {
      background: var(--op-white);
      border: 1px solid var(--op-border-card);
      border-radius: var(--op-radius-xl);
      padding: var(--op-space-4) 18px 18px;
      box-shadow: var(--op-elevation-2);
    }
    .spread-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--op-silver-light);
      margin-bottom: var(--op-space-3);
    }
    .spread-total { display: flex; align-items: baseline; gap: 8px; margin-bottom: 14px; }
    .spread-total .stat-value { font-family: var(--op-font-display); font-size: 38px; font-weight: 600; line-height: 1; color: var(--op-dark-green); }
    .spread-total .unit { font-size: 12.5px; color: var(--op-silver-light); }

    .spread-bar {
      display: flex;
      gap: 2px;
      height: 10px;
      border-radius: var(--op-radius-full);
      overflow: hidden;
      background: var(--op-chip-neutral-bg);
      margin-bottom: 14px;
    }
    .spread-bar span { display: block; height: 100%; }

    .spread-legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .spread-legend li { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--op-silver-dark); }
    .spread-legend .swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
    .spread-legend .name { flex: 1; }
    .spread-legend .num { font-weight: 700; color: var(--op-dark-green); min-width: 20px; text-align: right; }
    .spread-legend .pct { color: var(--op-silver-light); font-size: 12px; min-width: 38px; text-align: right; }

    /* ---------- Toolbar ---------- */
    .toolbar {
      display: flex;
      align-items: center;
      gap: var(--op-space-3);
      margin-bottom: var(--op-space-4);
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 220px;
      padding: 9px 12px;
      border-radius: var(--op-radius-md);
      border: 1.5px solid var(--op-border-input);
      font-size: 13.5px;
      font-family: inherit;
      background: var(--op-white);
      color: var(--op-dark-green);
    }
    .search-input:hover { border-color: var(--op-dark-green); }
    .search-input:focus-visible { border-color: var(--op-dark-green); border-width: 2px; padding: 8.5px 11.5px; box-shadow: var(--op-focus-ring); outline: none; }
    .search-input::placeholder { color: var(--op-silver-light); }

    /* ---------- Table ---------- */
    .table-wrap {
      background: var(--op-white);
      border: 1px solid var(--op-border-card);
      border-radius: var(--op-radius-xl);
      overflow-x: auto;
      box-shadow: var(--op-elevation-1);
    }

    .data-table { width: 100%; min-width: 900px; border-collapse: collapse; }
    .data-table th {
      text-align: left;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .09em;
      font-weight: 700;
      color: var(--op-silver-light);
      background: var(--op-chip-neutral-bg);
      padding: 12px 16px;
      border-bottom: 1px solid var(--op-border-card);
      white-space: nowrap;
    }
    .data-table td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--op-border-divider);
      font-size: 13.5px;
      vertical-align: middle;
      white-space: nowrap;
    }
    .data-table tbody tr { cursor: pointer; }
    .data-table tbody tr:last-child td { border-bottom: none; }
    .data-table tbody tr:hover { background: #F4F6EF; }

    .customer-cell { display: flex; align-items: center; gap: 10px; }
    .customer-name { font-weight: 700; color: var(--op-dark-green); }

    .table-empty { padding: 40px 16px; text-align: center; color: var(--op-silver-light); font-size: 13.5px; }

    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--op-space-3);
      padding: 12px 16px;
      border-top: 1px solid var(--op-border-card);
      color: var(--op-silver-light);
      font-size: 12.5px;
      background: var(--op-white);
      position: sticky;
      left: 0;
    }

    /* ---------- Avatars (deterministic squircles) ---------- */
    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--op-font-display);
      font-weight: 600;
      font-size: 12px;
      flex-shrink: 0;
    }
    .avatar.sm { width: 28px; height: 28px; border-radius: var(--op-radius-sm); font-size: 11px; }
    .avatar.lg { width: 62px; height: 62px; border-radius: 16px; font-size: 20px; }
    .avatar.fill-1 { background: var(--op-avatar-1-bg); color: var(--op-avatar-1-text); }
    .avatar.fill-2 { background: var(--op-avatar-2-bg); color: var(--op-avatar-2-text); }
    .avatar.fill-3 { background: var(--op-avatar-3-bg); color: var(--op-avatar-3-text); }
    .avatar.fill-4 { background: var(--op-avatar-4-bg); color: var(--op-avatar-4-text); }

    .owner-cell { display: flex; align-items: center; gap: 8px; }

    /* ---------- Chips ---------- */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      border-radius: var(--op-radius-sm);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .status-badge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }
    .status-active { background: var(--op-chip-success-bg); color: var(--op-chip-success-text); }
    .status-pending { background: var(--op-chip-warning-bg); color: var(--op-chip-warning-text); }
    /* Inactive is not an error, so it uses the neutral pair (red is reserved for overdue/failed). */
    .status-inactive { background: var(--op-chip-neutral-bg); color: var(--op-chip-neutral-text); }
    .status-inactive::before { background: var(--op-silver-light); }

    .class-chip {
      display: inline-flex;
      align-items: center;
      padding: 5px 11px;
      border-radius: var(--op-radius-sm);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .class-Enterprise { background: var(--op-dark-green); color: var(--op-accent-lime); }
    .class-SME { background: var(--op-light-green); color: var(--op-dark-green); }
    .class-Growth { background: var(--op-chip-neutral-bg); color: var(--op-dark-green); }

    /* ---------- Buttons ---------- */
    .view-btn {
      border: 1.5px solid var(--op-dark-green);
      background: var(--op-white);
      border-radius: var(--op-radius-md);
      padding: 6px 12px;
      font-family: var(--op-font-display);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--op-dark-green);
      white-space: nowrap;
      transition: background-color .16s, color .16s;
    }
    .view-btn:hover:not(:disabled) { background: var(--op-dark-green); color: var(--op-accent-lime); }
    .view-btn:disabled { background: #8FA08C; border-color: #8FA08C; color: var(--op-cream); cursor: not-allowed; }

    .btn-group { display: flex; gap: var(--op-space-2); }

    .text-link {
      font-weight: 700;
      font-size: 14px;
      color: var(--op-dark-green);
      border-bottom: 1.5px solid var(--op-dark-green);
    }
    .text-link:hover { color: var(--op-success); border-color: var(--op-success); }

    .back-link { display: inline-block; margin-bottom: var(--op-space-4); }

    /* ---------- Details ---------- */
    .hero {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      background: var(--op-dark-green);
      color: var(--op-cream);
      border-radius: var(--op-radius-xl);
      padding: var(--op-space-6);
      box-shadow: var(--op-elevation-hero);
    }
    .hero h1 {
      margin: 0 0 6px;
      font-family: var(--op-font-display);
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -.015em;
      line-height: 1.15;
      color: var(--op-cream);
    }
    .hero-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--op-light-green); }
    .hero-meta .dot { opacity: .5; }

    .detail-grid {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
      gap: var(--op-space-4);
      margin-top: var(--op-space-6);
      align-items: start;
    }
    .detail-col { display: flex; flex-direction: column; gap: var(--op-space-4); }

    .panel {
      background: var(--op-white);
      border: 1px solid var(--op-border-card);
      border-radius: var(--op-radius-xl);
      box-shadow: var(--op-elevation-2);
      padding: var(--op-space-6);
    }

    .panel-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 18px;
    }
    .panel-num { font-family: var(--op-font-display); font-size: 18px; color: #2f6b1e; }
    .panel-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--op-silver-light);
    }

    .fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px 24px;
    }
    .fields.single { grid-template-columns: 1fr; }

    .field-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .09em;
      color: var(--op-silver-light);
      margin-bottom: 4px;
    }
    .field-value { color: var(--op-dark-green); font-weight: 500; font-size: 14px; word-break: break-word; }
    .field-value .text-link { font-size: 13.5px; }

    .owner-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #F4F6EF;
      border: 1px solid rgba(2, 56, 25, .1);
      border-radius: 10px;
      padding: 9px 12px;
    }
    .owner-chip .name { font-weight: 700; font-size: 14px; color: var(--op-dark-green); }
    .owner-chip .role { font-size: 12px; color: var(--op-silver-light); }

    .not-found {
      background: var(--op-white);
      border: 1px dashed var(--op-border-card);
      border-radius: var(--op-radius-xl);
      padding: 48px;
      text-align: center;
      color: var(--op-silver-light);
    }
    .not-found h2 { margin-top: 0; color: var(--op-dark-green); font-family: var(--op-font-display); font-weight: 600; }

    /* ---------- Responsive ---------- */
    @media (max-width: 1100px) {
      .spread-cards { grid-template-columns: 1fr; }
      .detail-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 760px) {
      .app { flex-direction: column; }
      .rail {
        width: 100%;
        height: auto;
        flex-direction: row;
        padding: 10px 16px;
        position: static;
      }
      .rail-avatar { margin-top: 0; }
      .main { padding: var(--op-space-4) 16px 40px; }
      .page-header h1, .hero h1 { font-size: 24px; }
      .spread-total .stat-value { font-size: 30px; }
      .fields { grid-template-columns: 1fr; }
      .panel, .hero { padding: var(--op-space-4); }
    }
  </style>
</head>

      { id: "CUS-1010", companyName: "Lome Beverages SA", contactName: "Koffi Agbeko", email: "koffi@lomebev.tg", phone: "+228 90 12 34 56", customerClass: "SME", channel: "Internal", status: "inactive", country: "Togo", city: "Lomé", address: "Boulevard du 13 Janvier, Lomé", industry: "Food & Beverage", rcNumber: "TG-LOM-2018-B-5678", taxId: "NIF 1000123456", accountManager: "Babatope Ayeni", createdAt: "2024-09-30" },
      { id: "CUS-1011", companyName: "Sahara Sesame Ltd", contactName: "Fatima Bello", email: "fatima@saharasesame.com", phone: "+234 810 666 9900", customerClass: "SME", channel: "Website", status: "active", country: "Nigeria", city: "Kaduna", address: "22 Ahmadu Bello Way, Kaduna", industry: "Agriculture", rcNumber: "RC 7890123", taxId: "TIN 80930312-0001", accountManager: "Adeshewa Adelowo", createdAt: "2025-08-04" },
      { id: "CUS-1012", companyName: "Cape Machinery Imports", contactName: "Johan van der Merwe", email: "johan@capemachinery.co.za", phone: "+27 21 555 0101", customerClass: "Enterprise", channel: "Website", status: "pending", country: "South Africa", city: "Cape Town", address: "10 Paarden Eiland Rd, Cape Town", industry: "Heavy Machinery", rcNumber: "2016/123456/07", taxId: "VAT 4123456789", accountManager: "Kayode Akintade", createdAt: "2025-09-12" }
    ];

    const PAGE_SIZE = 8;
    const STATUS_LABELS = { active: "Active", pending: "Pending", inactive: "Inactive" };

    const state = { search: "", page: 1 };

    // ---------------------------------------------------------------
    // Helpers
    // ---------------------------------------------------------------
    const $ = (sel) => document.querySelector(sel);

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function initials(name) {
      return name.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join("");
    }

    // Deterministic avatar fill: the same name always gets the same brand fill (design system §08).
    function avatarFill(name) {
      let hash = 0;
      for (const ch of name) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
      return "fill-" + ((hash % 4) + 1);
    }

    function avatar(name, size = "") {
      return `<div class="avatar ${size} ${avatarFill(name)}" aria-hidden="true">${escapeHtml(initials(name))}</div>`;
    }

    function formatDate(iso) {
      return new Date(iso + "T00:00:00").toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
    }

    function statusBadge(status) {
      return `<span class="status-badge status-${status}">${STATUS_LABELS[status] || escapeHtml(status)}</span>`;
    }

    function parseRoute() {
      const hash = location.hash.replace(/^#/, "") || "/customers";
      return hash.split("?")[0].split("/").filter(Boolean);
    }

    function setBreadcrumb(items) {
      $("#breadcrumb").innerHTML = items
        .map((item, i) => i === items.length - 1
          ? `<strong>${escapeHtml(item.label)}</strong>`
          : `<a href="${item.href}">${escapeHtml(item.label)}</a>`)
        .join("<span aria-hidden=\"true\">/</span>");
    }

    function classChip(customerClass) {
      return `<span class="class-chip class-${escapeHtml(customerClass)}">${escapeHtml(customerClass)}</span>`;
    }

    // ---------------------------------------------------------------
    // Mini analytics: three spread cards
    // ---------------------------------------------------------------
    const SPREADS = [
      {
        title: "Customer spread",
        key: "status",
        segments: [
          { value: "active", label: "Active", color: "#1F8A5B" },
          { value: "pending", label: "Pending", color: "#FFCC1A" },
          { value: "inactive", label: "Inactive", color: "#808080" }
        ]
      },
      {
        title: "Customer class spread",
        key: "customerClass",
        segments: [
          { value: "Enterprise", label: "Enterprise", color: "#023819" },
          { value: "SME", label: "SME", color: "#7FAE2E" },
          { value: "Growth", label: "Growth", color: "#BFFB4F" }
        ]
      },
      {
        title: "Customer registration spread",
        key: "channel",
        segments: [
          { value: "Website", label: "Website", color: "#2F7A3F" },
          { value: "Internal", label: "Internal", color: "#D1DBBD" }
        ]
      }
    ];

    function spreadCard(spread) {
      const total = customers.length;
      const rows = spread.segments.map((seg) => {
        const count = customers.filter((c) => c[spread.key] === seg.value).length;
        return { ...seg, count, pct: total ? Math.round((count / total) * 100) : 0 };
      });
      const summary = rows.map((r) => `${r.label} ${r.count}`).join(", ");

      return `
        <section class="spread-card">
          <div class="spread-title">${spread.title}</div>
          <div class="spread-total">
            <span class="stat-value">${total}</span>
            <span class="unit">total customers</span>
          </div>
          <div class="spread-bar" role="img" aria-label="${escapeHtml(spread.title)}: ${escapeHtml(summary)}">
            ${rows.filter((r) => r.count).map((r) =>
              `<span style="flex: ${r.count}; background: ${r.color}" title="${r.label}: ${r.count}"></span>`).join("")}
          </div>
          <ul class="spread-legend">
            ${rows.map((r) => `
              <li>
                <span class="swatch" style="background: ${r.color}"></span>
                <span class="name">${r.label}</span>
                <span class="num">${r.count}</span>
                <span class="pct">${r.pct}%</span>
              </li>`).join("")}
          </ul>
        </section>
      `;
    }

    // ---------------------------------------------------------------
    // All customers view
    // ---------------------------------------------------------------
    function renderList() {
      setBreadcrumb([{ label: "Customers", href: "#/customers" }, { label: "All customers" }]);

      $("#view").innerHTML = `
        <div class="page-header">
          <h1>All customers</h1>
          <p class="muted">Basic information for every OnePort365 customer.</p>
        </div>

        <div class="spread-cards">
          ${SPREADS.map(spreadCard).join("")}
        </div>

        <div class="toolbar">
          <input class="search-input" id="search" type="search" placeholder="Search by company, contact, email or phone…" value="${escapeHtml(state.search)}" aria-label="Search customers" />
        </div>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Customer</th>
                <th>Primary contact</th>
                <th>Class</th>
                <th>Registration channel</th>
                <th>Account manager</th>
                <th>Status</th>
                <th>Date added</th>
              </tr>
            </thead>
            <tbody id="customer-rows"></tbody>
          </table>
          <div class="pagination" id="pagination"></div>
        </div>
      `;

      $("#search").addEventListener("input", (e) => {
        state.search = e.target.value;
        state.page = 1;
        renderRows();
      });

      renderRows();
    }

    function renderRows() {
      const term = state.search.trim().toLowerCase();
      const filtered = customers.filter((c) => {
        if (!term) return true;
        return [c.companyName, c.contactName, c.email, c.phone, c.id].some((v) => v.toLowerCase().includes(term));
      });

      const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
      state.page = Math.min(state.page, totalPages);
      const start = (state.page - 1) * PAGE_SIZE;
      const pageItems = filtered.slice(start, start + PAGE_SIZE);

      const tbody = $("#customer-rows");
      if (!pageItems.length) {
        tbody.innerHTML = `<tr><td colspan="7" class="table-empty">No customers match your search.</td></tr>`;
      } else {
        tbody.innerHTML = pageItems.map((c) => `
          <tr data-id="${escapeHtml(c.id)}" tabindex="0">
            <td>
              <div class="customer-cell">
                ${avatar(c.companyName)}
                <span class="customer-name">${escapeHtml(c.companyName)}</span>
              </div>
            </td>
            <td>
              <div>${escapeHtml(c.email)}</div>
              <div class="muted">${escapeHtml(c.phone)}</div>
            </td>
            <td>${classChip(c.customerClass)}</td>
            <td>${escapeHtml(c.channel)}</td>
            <td>
              <div class="owner-cell">
                ${avatar(c.accountManager, "sm")}
                <span>${escapeHtml(c.accountManager)}</span>
              </div>
            </td>
            <td>${statusBadge(c.status)}</td>
            <td>${formatDate(c.createdAt)}</td>
          </tr>
        `).join("");

        tbody.querySelectorAll("tr[data-id]").forEach((row) => {
          const open = () => { location.hash = `#/customers/${encodeURIComponent(row.dataset.id)}`; };
          row.addEventListener("click", open);
          row.addEventListener("keydown", (e) => { if (e.key === "Enter") open(); });
        });
      }

      const from = filtered.length ? start + 1 : 0;
      const to = start + pageItems.length;
      $("#pagination").innerHTML = `
        <span>Showing ${from}–${to} of ${filtered.length}</span>
        <div class="btn-group">
          <button class="view-btn" id="prev" ${state.page <= 1 ? "disabled" : ""}>Previous</button>
          <button class="view-btn" id="next" ${state.page >= totalPages ? "disabled" : ""}>Next</button>
        </div>
      `;
      $("#prev").addEventListener("click", () => { state.page--; renderRows(); });
      $("#next").addEventListener("click", () => { state.page++; renderRows(); });
    }

    // ---------------------------------------------------------------
    // Customer details view
    // ---------------------------------------------------------------
    function field(label, value) {
      return `<div><div class="field-label">${label}</div><div class="field-value">${value}</div></div>`;
    }

    function panel(num, title, body, single = false) {
      return `
        <section class="panel">
          <div class="panel-head"><span class="panel-num">${num}</span><span class="panel-title">${title}</span></div>
          <div class="fields ${single ? "single" : ""}">${body}</div>
        </section>
      `;
    }

    function renderDetails(id) {
      const c = customers.find((x) => x.id === id);

      if (!c) {
        setBreadcrumb([{ label: "Customers", href: "#/customers" }, { label: "Not found" }]);
        $("#view").innerHTML = `
          <a class="text-link back-link" href="#/customers">← Back to all customers</a>
          <div class="not-found">
            <h2>Customer not found</h2>
            <p>No customer with ID <strong>${escapeHtml(id)}</strong> exists.</p>
          </div>
        `;
        return;
      }

      setBreadcrumb([
        { label: "Customers", href: "#/customers" },
        { label: "All customers", href: "#/customers" },
        { label: c.companyName }
      ]);

      $("#view").innerHTML = `
        <a class="text-link back-link" href="#/customers">← Back to all customers</a>

        <section class="hero">
          ${avatar(c.companyName, "lg")}
          <div>
            <h1>${escapeHtml(c.companyName)}</h1>
            <div class="hero-meta">
              <span>${escapeHtml(c.id)}</span>
              ${statusBadge(c.status)}
              <span>Customer since ${formatDate(c.createdAt)}</span>
            </div>
          </div>
        </section>

        <div class="detail-grid">
          <div class="detail-col">
            ${panel("01", "Basic details", `
              ${field("Company name", escapeHtml(c.companyName))}
              ${field("Customer ID", escapeHtml(c.id))}
              ${field("Class", classChip(c.customerClass))}
              ${field("Registration channel", escapeHtml(c.channel))}
              ${field("Industry", escapeHtml(c.industry))}
              ${field("Registration (RC) number", escapeHtml(c.rcNumber))}
              ${field("Tax ID", escapeHtml(c.taxId))}
              ${field("Status", statusBadge(c.status))}
              ${field("Date added", formatDate(c.createdAt))}
            `)}
            ${panel("02", "Address", `
              ${field("Street address", escapeHtml(c.address))}
              ${field("City", escapeHtml(c.city))}
              ${field("Country", escapeHtml(c.country))}
            `)}
          </div>

          <div class="detail-col">
            ${panel("03", "Primary contact", `
              ${field("Name", escapeHtml(c.contactName))}
              ${field("Email", `<a class="text-link" href="mailto:${escapeHtml(c.email)}">${escapeHtml(c.email)}</a>`)}
              ${field("Phone", `<a class="text-link" href="tel:${escapeHtml(c.phone.replace(/\s+/g, ""))}">${escapeHtml(c.phone)}</a>`)}
            `, true)}
            ${panel("04", "Account", `
              <div>
                <div class="field-label">Account manager</div>
                <div class="owner-chip">
                  ${avatar(c.accountManager, "sm")}
                  <div>
                    <div class="name">${escapeHtml(c.accountManager)}</div>
                    <div class="role">Account manager</div>
                  </div>
                </div>
              </div>
            `, true)}
          </div>
        </div>
      `;
    }

    // ---------------------------------------------------------------
    // Router
    // ---------------------------------------------------------------
    function router() {
      const parts = parseRoute();
      window.scrollTo(0, 0);

      if (parts[0] !== "customers") {
        location.hash = "#/customers";
        return;
      }

      if (parts[1]) {
        renderDetails(decodeURIComponent(parts[1]));
      } else {
        renderList();
      }
    }

    window.addEventListener("hashchange", router);
    router();
  </script>
</body>
