<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Backoffice · Customers</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-2: #f0f3f8;
      --border: #e3e8ef;
      --text: #1a2233;
      --text-muted: #667085;
      --primary: #1f5eff;
      --primary-soft: #e8efff;
      --nav-bg: #0f1b3d;
      --nav-text: #c3cbe0;
      --nav-active: #ffffff;
      --success: #067647;
      --success-soft: #dcfae6;
      --warning: #b54708;
      --warning-soft: #fef0c7;
      --danger: #b42318;
      --danger-soft: #fee4e2;
      --radius: 10px;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.08);
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    a { color: var(--primary); text-decoration: none; }

    button { font: inherit; cursor: pointer; }

    /* ---------- Layout ---------- */
    .app {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      background: var(--nav-bg);
      color: var(--nav-text);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 20px;
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--primary);
      display: grid;
      place-items: center;
      font-size: 14px;
    }

    .brand small {
      display: block;
      font-weight: 400;
      font-size: 11px;
      color: var(--nav-text);
    }

    .nav { padding: 16px 12px; flex: 1; overflow-y: auto; }

    .nav-section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #7f8bab;
      padding: 0 10px;
      margin: 8px 0 8px;
    }

    .nav a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 8px;
      color: var(--nav-text);
      margin-bottom: 2px;
    }

    .nav a:hover { background: rgba(255, 255, 255, 0.06); color: #fff; }

    .nav a.active { background: rgba(255, 255, 255, 0.12); color: var(--nav-active); font-weight: 600; }

    .nav .count {
      font-size: 11px;
      background: rgba(255, 255, 255, 0.1);
      padding: 1px 8px;
      border-radius: 999px;
    }

    .nav-footer {
      padding: 16px 20px;
      font-size: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .main { min-width: 0; }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 28px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .menu-toggle {
      display: none;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 8px;
      padding: 6px 10px;
    }

    .breadcrumb { color: var(--text-muted); font-size: 13px; }
    .breadcrumb a { color: var(--text-muted); }
    .breadcrumb a:hover { color: var(--primary); }
    .breadcrumb .sep { margin: 0 6px; }
    .breadcrumb strong { color: var(--text); font-weight: 600; }

    .content { padding: 28px; max-width: 1200px; }

    .page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .page-header h1 { margin: 0; font-size: 22px; }
    .page-header p { margin: 4px 0 0; color: var(--text-muted); }

    /* ---------- Stats ---------- */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .stat .label { color: var(--text-muted); font-size: 12px; }
    .stat .value { font-size: 24px; font-weight: 700; margin-top: 4px; }

    /* ---------- Card / Table ---------- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .toolbar {
      display: flex;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .input, .select {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font: inherit;
      background: var(--surface);
      color: var(--text);
    }

    .input { flex: 1; min-width: 200px; }
    .input:focus, .select:focus { outline: 2px solid var(--primary-soft); border-color: var(--primary); }

    .table-wrap { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; }

    th, td {
      text-align: left;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    th {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--surface-2);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #f8faff; }
    tbody tr:last-child td { border-bottom: none; }

    .customer-cell { display: flex; align-items: center; gap: 10px; }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--primary-soft);
      color: var(--primary);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 12px;
      flex-shrink: 0;
    }

    .avatar.lg { width: 56px; height: 56px; font-size: 18px; }

    .muted { color: var(--text-muted); font-size: 12px; }

    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge.active { background: var(--success-soft); color: var(--success); }
    .badge.pending { background: var(--warning-soft); color: var(--warning); }
    .badge.inactive { background: var(--danger-soft); color: var(--danger); }

    .empty { padding: 40px; text-align: center; color: var(--text-muted); }

    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 13px;
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 7px 14px;
      border-radius: 8px;
      font-weight: 500;
    }

    .btn:hover:not(:disabled) { background: var(--surface-2); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #1a4fd8; }

    .btn-group { display: flex; gap: 8px; }

    /* ---------- Details ---------- */
    .profile {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px;
      flex-wrap: wrap;
    }

    .profile h2 { margin: 0; font-size: 20px; }
    .profile .meta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 4px; }

    .detail-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    .card-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
    }

    .fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px 24px;
      padding: 20px;
    }

    .fields.single { grid-template-columns: 1fr; }

    .field .label { color: var(--text-muted); font-size: 12px; margin-bottom: 2px; }
    .field .value { font-weight: 500; word-break: break-word; }

    .back-link { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 14px; font-weight: 500; }

    /* ---------- Responsive ---------- */
    @media (max-width: 960px) {
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .detail-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 760px) {
      .app { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        width: 240px;
        z-index: 20;
        transform: translateX(-100%);
        transition: transform 0.2s ease;
      }
      .sidebar.open { transform: translateX(0); }
      .menu-toggle { display: inline-block; }
      .content { padding: 16px; }
      .topbar { padding: 12px 16px; }
      .fields { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Customer module side nav -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">OP</div>
        <div>
          Backoffice
          <small>Customer Module</small>
        </div>
      </div>
      <nav class="nav" aria-label="Customer navigation">
        <div class="nav-section-title">Customers</div>
        <a href="#/customers" data-nav="all">All Customers <span class="count" id="count-all">0</span></a>
        <a href="#/customers?status=active" data-nav="active">Active <span class="count" id="count-active">0</span></a>
        <a href="#/customers?status=pending" data-nav="pending">Pending <span class="count" id="count-pending">0</span></a>
        <a href="#/customers?status=inactive" data-nav="inactive">Inactive <span class="count" id="count-inactive">0</span></a>
      </nav>
      <div class="nav-footer">Signed in as Backoffice Admin</div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="menu-toggle" id="menu-toggle" aria-label="Toggle navigation">☰</button>
        <div class="breadcrumb" id="breadcrumb"></div>
      </header>
      <main class="content" id="view"></main>
    </div>
  </div>

  <script>
    // ---------------------------------------------------------------
    // Sample data. Replace with an API call when the backend is ready.
    // ---------------------------------------------------------------
    const customers = [
      { id: "CUS-1001", companyName: "Adeola Foods Ltd", contactName: "Adeola Bankole", email: "adeola@adeolafoods.com", phone: "+234 803 123 4567", type: "Importer", status: "active", country: "Nigeria", city: "Lagos", address: "12 Marina Road, Lagos Island", industry: "Food & Beverage", rcNumber: "RC 1234567", taxId: "TIN 20394857-0001", accountManager: "Chioma Eze", createdAt: "2025-01-14" },

      { id: "CUS-1003", companyName: "Gold Coast Traders", contactName: "Kwame Mensah", email: "kwame@goldcoasttraders.com", phone: "+233 24 111 2233", type: "Importer & Exporter", status: "pending", country: "Ghana", city: "Accra", address: "8 Independence Ave, Accra", industry: "General Trading", rcNumber: "CS 998877", taxId: "GH-TIN C0012345678", accountManager: "Chioma Eze", createdAt: "2025-03-21" },
      { id: "CUS-1004", companyName: "Port Harcourt Energy Supplies", contactName: "Blessing Okoro", email: "blessing@phes.com", phone: "+234 809 222 3344", type: "Importer", status: "active", country: "Nigeria", city: "Port Harcourt", address: "3 Trans-Amadi Industrial Layout", industry: "Oil & Gas", rcNumber: "RC 3456789", taxId: "TIN 40596978-0001", accountManager: "Femi Johnson", createdAt: "2025-04-09" },
      { id: "CUS-1005", companyName: "Nairobi Textiles Co.", contactName: "Wanjiru Kamau", email: "wanjiru@nairobitextiles.co.ke", phone: "+254 712 345 678", type: "Importer", status: "inactive", country: "Kenya", city: "Nairobi", address: "Industrial Area, Enterprise Rd", industry: "Textiles", rcNumber: "PVT-7XY12AB", taxId: "KRA P051234567Z", accountManager: "Tunde Ade", createdAt: "2024-11-28" },
      { id: "CUS-1006", companyName: "Abuja Pharma Distributors", contactName: "Ngozi Umeh", email: "ngozi@abujapharma.com", phone: "+234 802 987 6543", type: "Importer", status: "active", country: "Nigeria", city: "Abuja", address: "Plot 22, Wuse Zone 4", industry: "Pharmaceuticals", rcNumber: "RC 4567890", taxId: "TIN 50607089-0001", accountManager: "Chioma Eze", createdAt: "2025-05-17" },
      { id: "CUS-1007", companyName: "Cocoa Coast Exporters", contactName: "Samuel Adeyemi", email: "samuel@cocoacoast.com", phone: "+234 805 444 7788", type: "Exporter", status: "pending", country: "Nigeria", city: "Ibadan", address: "17 Ring Road, Ibadan", industry: "Agriculture", rcNumber: "RC 5678901", taxId: "TIN 60718190-0001", accountManager: "Femi Johnson", createdAt: "2025-06-02" },
      { id: "CUS-1008", companyName: "Dakar Logistics Hub", contactName: "Aminata Diallo", email: "aminata@dakarhub.sn", phone: "+221 77 123 4567", type: "Importer & Exporter", status: "active", country: "Senegal", city: "Dakar", address: "Zone Portuaire, Dakar", industry: "Logistics", rcNumber: "SN-DKR-2019-B-1234", taxId: "NINEA 005678901", accountManager: "Tunde Ade", createdAt: "2025-06-25" },
      { id: "CUS-1009", companyName: "Enugu Auto Parts", contactName: "Chinedu Obi", email: "chinedu@enuguauto.com", phone: "+234 807 333 1122", type: "Importer", status: "active", country: "Nigeria", city: "Enugu", address: "5 Ogui Road, Enugu", industry: "Automotive", rcNumber: "RC 6789012", taxId: "TIN 70829201-0001", accountManager: "Chioma Eze", createdAt: "2025-07-11" },
      { id: "CUS-1010", companyName: "Lome Beverages SA", contactName: "Koffi Agbeko", email: "koffi@lomebev.tg", phone: "+228 90 12 34 56", type: "Importer", status: "inactive", country: "Togo", city: "Lomé", address: "Boulevard du 13 Janvier, Lomé", industry: "Food & Beverage", rcNumber: "TG-LOM-2018-B-5678", taxId: "NIF 1000123456", accountManager: "Femi Johnson", createdAt: "2024-09-30" },
      { id: "CUS-1011", companyName: "Sahara Sesame Ltd", contactName: "Fatima Bello", email: "fatima@saharasesame.com", phone: "+234 810 666 9900", type: "Exporter", status: "active", country: "Nigeria", city: "Kaduna", address: "22 Ahmadu Bello Way, Kaduna", industry: "Agriculture", rcNumber: "RC 7890123", taxId: "TIN 80930312-0001", accountManager: "Tunde Ade", createdAt: "2025-08-04" },
      { id: "CUS-1012", companyName: "Cape Machinery Imports", contactName: "Johan van der Merwe", email: "johan@capemachinery.co.za", phone: "+27 21 555 0101", type: "Importer", status: "pending", country: "South Africa", city: "Cape Town", address: "10 Paarden Eiland Rd, Cape Town", industry: "Heavy Machinery", rcNumber: "2016/123456/07", taxId: "VAT 4123456789", accountManager: "Chioma Eze", createdAt: "2025-09-12" }
    ];

    const PAGE_SIZE = 8;
    const STATUS_LABELS = { active: "Active", pending: "Pending", inactive: "Inactive" };

    const state = { search: "", page: 1 };

    // ---------------------------------------------------------------
    // Helpers
    // ---------------------------------------------------------------
    const $ = (sel) => document.querySelector(sel);

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function initials(name) {
      return name.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join("");
    }

    function formatDate(iso) {
      return new Date(iso + "T00:00:00").toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
    }

    function badge(status) {
      return `<span class="badge ${status}">${STATUS_LABELS[status] || status}</span>`;
    }

    function parseRoute() {
      const hash = location.hash.replace(/^#/, "") || "/customers";
      const [path, query = ""] = hash.split("?");
      const params = new URLSearchParams(query);
      const parts = path.split("/").filter(Boolean);
      return { parts, params };
    }

    // ---------------------------------------------------------------
    // Side nav
    // ---------------------------------------------------------------
    function updateNav(activeKey) {
      $("#count-all").textContent = customers.length;
      Object.keys(STATUS_LABELS).forEach((s) => {
        $("#count-" + s).textContent = customers.filter((c) => c.status === s).length;
      });
      document.querySelectorAll(".nav a").forEach((a) => {
        a.classList.toggle("active", a.dataset.nav === activeKey);
      });
    }

    function setBreadcrumb(items) {
      $("#breadcrumb").innerHTML = items
        .map((item, i) => i === items.length - 1
          ? `<strong>${escapeHtml(item.label)}</strong>`
          : `<a href="${item.href}">${escapeHtml(item.label)}</a>`)
        .join('<span class="sep">/</span>');
    }

    // ---------------------------------------------------------------
    // All customers view
    // ---------------------------------------------------------------
    function renderList(statusFilter) {
      updateNav(statusFilter || "all");
      const title = statusFilter ? `${STATUS_LABELS[statusFilter]} Customers` : "All Customers";
      setBreadcrumb([{ label: "Customers", href: "#/customers" }, { label: title }]);

      const count = (s) => customers.filter((c) => c.status === s).length;

      $("#view").innerHTML = `
        <div class="page-header">
          <div>
            <h1>${title}</h1>
            <p>View and manage basic information for every customer.</p>
          </div>
        </div>

        <section class="stats">
          <div class="stat"><div class="label">Total customers</div><div class="value">${customers.length}</div></div>
          <div class="stat"><div class="label">Active</div><div class="value">${count("active")}</div></div>
          <div class="stat"><div class="label">Pending</div><div class="value">${count("pending")}</div></div>
          <div class="stat"><div class="label">Inactive</div><div class="value">${count("inactive")}</div></div>
        </section>

        <section class="card">
          <div class="toolbar">
            <input class="input" id="search" type="search" placeholder="Search by company, contact, email or ID…" value="${escapeHtml(state.search)}" />
            <select class="select" id="status-filter" aria-label="Filter by status">
              <option value="">All statuses</option>
              ${Object.entries(STATUS_LABELS).map(([k, v]) =>
                `<option value="${k}" ${k === statusFilter ? "selected" : ""}>${v}</option>`).join("")}
            </select>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Customer</th>
                  <th>Customer ID</th>
                  <th>Contact</th>
                  <th>Type</th>
                  <th>Country</th>
                  <th>Status</th>
                  <th>Date Added</th>
                </tr>
              </thead>
              <tbody id="customer-rows"></tbody>
            </table>
          </div>
          <div class="pagination" id="pagination"></div>
        </section>
      `;

      $("#search").addEventListener("input", (e) => {
        state.search = e.target.value;
        state.page = 1;
        renderRows(statusFilter);
      });

      $("#status-filter").addEventListener("change", (e) => {
        state.page = 1;
        location.hash = e.target.value ? `#/customers?status=${e.target.value}` : "#/customers";
      });

      renderRows(statusFilter);
    }

    function renderRows(statusFilter) {
      const term = state.search.trim().toLowerCase();
      const filtered = customers.filter((c) => {
        if (statusFilter && c.status !== statusFilter) return false;
        if (!term) return true;
        return [c.companyName, c.contactName, c.email, c.id].some((v) => v.toLowerCase().includes(term));
      });

      const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
      state.page = Math.min(state.page, totalPages);
      const start = (state.page - 1) * PAGE_SIZE;
      const pageItems = filtered.slice(start, start + PAGE_SIZE);

      const tbody = $("#customer-rows");
      if (!pageItems.length) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty">No customers match your search.</td></tr>`;
      } else {
        tbody.innerHTML = pageItems.map((c) => `
          <tr data-id="${c.id}" tabindex="0">
            <td>
              <div class="customer-cell">
                <div class="avatar">${initials(c.companyName)}</div>
                <div>
                  <div><strong>${escapeHtml(c.companyName)}</strong></div>
                  <div class="muted">${escapeHtml(c.email)}</div>
                </div>
              </div>
            </td>
            <td>${c.id}</td>
            <td>${escapeHtml(c.contactName)}</td>
            <td>${escapeHtml(c.type)}</td>
            <td>${escapeHtml(c.country)}</td>
            <td>${badge(c.status)}</td>
            <td>${formatDate(c.createdAt)}</td>
          </tr>
        `).join("");

        tbody.querySelectorAll("tr[data-id]").forEach((row) => {
          const open = () => { location.hash = `#/customers/${row.dataset.id}`; };
          row.addEventListener("click", open);
          row.addEventListener("keydown", (e) => { if (e.key === "Enter") open(); });
        });
      }

      const from = filtered.length ? start + 1 : 0;
      const to = start + pageItems.length;
      $("#pagination").innerHTML = `
        <span>Showing ${from}–${to} of ${filtered.length}</span>
        <div class="btn-group">
          <button class="btn" id="prev" ${state.page <= 1 ? "disabled" : ""}>Previous</button>
          <button class="btn" id="next" ${state.page >= totalPages ? "disabled" : ""}>Next</button>
        </div>
      `;
      $("#prev").addEventListener("click", () => { state.page--; renderRows(statusFilter); });
      $("#next").addEventListener("click", () => { state.page++; renderRows(statusFilter); });
    }

    // ---------------------------------------------------------------
    // Customer details view
    // ---------------------------------------------------------------
    function field(label, value) {
      return `<div class="field"><div class="label">${label}</div><div class="value">${value}</div></div>`;
    }

    function renderDetails(id) {
      const c = customers.find((x) => x.id === id);
      updateNav("all");

      if (!c) {
        setBreadcrumb([{ label: "Customers", href: "#/customers" }, { label: "Not found" }]);
        $("#view").innerHTML = `
          <a class="back-link" href="#/customers">← Back to all customers</a>
          <div class="card empty">Customer <strong>${escapeHtml(id)}</strong> was not found.</div>
        `;
        return;
      }

      setBreadcrumb([
        { label: "Customers", href: "#/customers" },
        { label: "All Customers", href: "#/customers" },
        { label: c.companyName }
      ]);

      $("#view").innerHTML = `
        <a class="back-link" href="#/customers">← Back to all customers</a>

        <section class="card profile">
          <div class="avatar lg">${initials(c.companyName)}</div>
          <div>
            <h2>${escapeHtml(c.companyName)}</h2>
            <div class="meta">
              <span class="muted">${c.id}</span>
              ${badge(c.status)}
              <span class="muted">Customer since ${formatDate(c.createdAt)}</span>
            </div>
          </div>
        </section>

        <div class="detail-grid">
          <div>
            <section class="card">
              <div class="card-header">Basic Details</div>
              <div class="fields">
                ${field("Company name", escapeHtml(c.companyName))}
                ${field("Customer ID", c.id)}
                ${field("Customer type", escapeHtml(c.type))}
                ${field("Industry", escapeHtml(c.industry))}
                ${field("Registration (RC) number", escapeHtml(c.rcNumber))}
                ${field("Tax ID", escapeHtml(c.taxId))}
                ${field("Status", badge(c.status))}
                ${field("Date added", formatDate(c.createdAt))}
              </div>
            </section>

            <section class="card" style="margin-top: 20px;">
              <div class="card-header">Address</div>
              <div class="fields">
                ${field("Street address", escapeHtml(c.address))}
                ${field("City", escapeHtml(c.city))}
                ${field("Country", escapeHtml(c.country))}
              </div>
            </section>
          </div>

          <div>
            <section class="card">
              <div class="card-header">Primary Contact</div>
              <div class="fields single">
                ${field("Name", escapeHtml(c.contactName))}
                ${field("Email", `<a href="mailto:${escapeHtml(c.email)}">${escapeHtml(c.email)}</a>`)}
                ${field("Phone", `<a href="tel:${escapeHtml(c.phone.replace(/\s+/g, ""))}">${escapeHtml(c.phone)}</a>`)}
              </div>
            </section>

            <section class="card" style="margin-top: 20px;">
              <div class="card-header">Account</div>
              <div class="fields single">
                ${field("Account manager", escapeHtml(c.accountManager))}
              </div>
            </section>
          </div>
        </div>
      `;
    }

    // ---------------------------------------------------------------
    // Router
    // ---------------------------------------------------------------
    function router() {
      const { parts, params } = parseRoute();
      $("#sidebar").classList.remove("open");
      window.scrollTo(0, 0);

      if (parts[0] !== "customers") {
        location.hash = "#/customers";
        return;
      }

      if (parts[1]) {
        renderDetails(decodeURIComponent(parts[1]));
      } else {
        const status = params.get("status");
        renderList(STATUS_LABELS[status] ? status : "");
      }
    }

    $("#menu-toggle").addEventListener("click", () => $("#sidebar").classList.toggle("open"));
    window.addEventListener("hashchange", router);
    router();
  </script>
</body>
</html>
